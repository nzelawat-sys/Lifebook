/* ------------------------------------------------------- mind */
const HOLD_BUCKETS = [
  { k: 'Intraday', t: (d) => d === 0 }, { k: '1d', t: (d) => d === 1 }, { k: '2d', t: (d) => d === 2 }, { k: '3–5', t: (d) => d >= 3 && d <= 5 },
  { k: '6–10', t: (d) => d >= 6 && d <= 10 }, { k: '11–21', t: (d) => d >= 11 && d <= 21 }, { k: '22–63', t: (d) => d >= 22 && d <= 63 }, { k: '63+', t: (d) => d > 63 },
];

function HoldLab({ ledger }) {
  const T = useTok();
  const trades = ledger.closedTrades;
  const losers = trades.filter((t) => t.pnl < 0);
  const rows = HOLD_BUCKETS.map((b) => {
    const all = trades.filter((t) => b.t(t.holdDays)), ls = all.filter((t) => t.pnl < 0);
    return { bucket: b.k, n: all.length, losers: ls.length, total: sum(ls, (t) => t.pnl), avg: ls.length ? sum(ls, (t) => t.pnl) / ls.length : null, winRate: all.length ? ((all.length - ls.length) / all.length) * 100 : null };
  });
  const base = rows.find((r) => r.avg !== null);
  rows.forEach((r) => { r.esc = base && r.avg !== null ? r.avg / base.avg : null; r.absAvg = r.avg !== null ? -r.avg : 0; });
  const openLosers = ledger.positions.filter((p) => p.openQty > 1e-9 && p.hasCmp && p.unrealized < 0);
  const noCmp = ledger.positions.filter((p) => p.openQty > 1e-9 && !p.hasCmp).length;
  const intra = rows[0];
  const byStrat = {};
  losers.forEach((t) => { byStrat[t.strategy] = (byStrat[t.strategy] || 0) + t.pnl; });
  const stratRows = Object.entries(byStrat).sort((a, b) => a[1] - b[1]);
  const totLoss = sum(losers, (t) => t.pnl);
  const maxIdx = rows.length - 1;
  return (
    <div className="stack">
      <div className="kpis">
        <KpiCard label="Closed losers" value={losers.length} hint={`of ${trades.length} closed trades`} />
        <KpiCard label="Total realised loss" value={fmtINR(totLoss)} tone="neg" />
        <KpiCard label="Intraday avg loss" value={intra.avg !== null ? fmtINR(intra.avg) : '—'} tone={intra.avg !== null ? 'neg' : ''} hint={`${intra.losers} intraday losers`} />
        <KpiCard label="Still-held losers" value={openLosers.length} hint={noCmp ? `${noCmp} open without CMP` : 'open at a loss now'} />
        <KpiCard label="Open loss carried" value={openLosers.length ? fmtINR(sum(openLosers, (p) => p.unrealized)) : '—'} tone={openLosers.length ? 'neg' : ''} />
      </div>
      <div className="grid2">
        <Card title="Average loss by holding period">
          <div className="chartbox">
            <ResponsiveContainer>
              <BarChart data={rows} layout="vertical" margin={{ top: 4, right: 16, left: 4, bottom: 0 }}>
                <CartesianGrid stroke={T.border} strokeDasharray="2 4" horizontal={false} />
                <XAxis type="number" {...axisProps(T)} tickFormatter={compactINR} />
                <YAxis type="category" dataKey="bucket" {...axisProps(T)} width={62} />
                <Tooltip {...tipStyle(T)} cursor={{ fill: T.card2 }} formatter={(v, n, p) => [`${fmtINR(-v)} avg · ${p.payload.losers} losers`, p.payload.bucket]} />
                <Bar dataKey="absAvg" radius={[0, 3, 3, 0]} isAnimationActive={false}>{rows.map((r, i) => <Cell key={r.bucket} fill={T.neg} fillOpacity={0.3 + (0.7 * i) / maxIdx} />)}</Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>
        <Card title="Buckets">
          <div className="tablewrap"><table className="t">
            <thead><tr><th>Hold</th><th className="n">Losers</th><th className="n">Avg loss</th><th className="n">Escalation</th><th className="n">Win rate</th></tr></thead>
            <tbody>{rows.map((r) => <tr key={r.bucket}><td>{r.bucket}</td><td className="n">{r.losers}<span className="muted tiny">/{r.n}</span></td><td className="n neg">{r.avg !== null ? fmtINR(r.avg) : '—'}</td>
              <td className={'n ' + (r.esc > 1.5 ? 'neg' : '')}>{r.esc !== null ? r.esc.toFixed(2) + '×' : '—'}</td><td className="n">{r.winRate !== null ? r.winRate.toFixed(0) + '%' : '—'}</td></tr>)}</tbody>
          </table></div>
          <div className="tiny muted" style={{ marginTop: 8 }}>Escalation = bucket's avg loss ÷ {base?.bucket || 'first'} avg loss. Hold time is the quantity-weighted days between entry lots and the closing fill.</div>
        </Card>
      </div>
      <Card title="Where the losses came from (by strategy)">
        {stratRows.length ? <div className="stack" style={{ gap: 8 }}>{stratRows.map(([s, v]) => (
          <div key={s} className="row small"><span style={{ width: 120 }}>{s}</span>
            <div className="grow" style={{ background: T.card2, borderRadius: 4, height: 10 }}><div style={{ width: `${(v / totLoss) * 100}%`, height: '100%', background: T.neg, borderRadius: 4 }} /></div>
            <span className="mono" style={{ width: 120, textAlign: 'right' }}>{fmtINR(v)}</span><span className="mono muted" style={{ width: 52, textAlign: 'right' }}>{((v / totLoss) * 100).toFixed(0)}%</span></div>))}</div>
          : <div className="muted small">No closed losers.</div>}
      </Card>
    </div>
  );
}

function StrategyBreakdown({ ledger }) {
  const rows = useMemo(() => {
    const m = {};
    ledger.closedTrades.forEach((t) => { const s = (m[t.strategy] = m[t.strategy] || { strategy: t.strategy, trades: [] }); s.trades.push(t); });
    ledger.positions.forEach((p) => { const k = p.strategy || 'Unassigned'; m[k] = m[k] || { strategy: k, trades: [] }; });
    return Object.values(m).map((s) => {
      const w = s.trades.filter((t) => t.pnl > 0), l = s.trades.filter((t) => t.pnl < 0);
      const openLoss = sum(ledger.positions.filter((p) => (p.strategy || 'Unassigned') === s.strategy && p.openQty > 1e-9 && p.unrealized < 0), (p) => p.unrealized);
      return { strategy: s.strategy, count: s.trades.length, winRate: s.trades.length ? (w.length / s.trades.length) * 100 : null, net: sum(s.trades, (t) => t.net),
        gross: sum(s.trades, (t) => t.pnl), avgWin: w.length ? sum(w, (t) => t.pnl) / w.length : null, avgLoss: l.length ? sum(l, (t) => t.pnl) / l.length : null, openLoss };
    }).sort((a, b) => b.net - a.net);
  }, [ledger]);
  const { sorted, Th } = useSort(rows, null, {});
  return (
    <Card title="Strategy-wise">
      <div className="tablewrap"><table className="t">
        <thead><tr><Th k="strategy">Strategy</Th><Th k="count" n>Trades</Th><Th k="winRate" n>Win rate</Th><Th k="gross" n>Gross P&amp;L</Th><Th k="net" n>Net P&amp;L</Th><Th k="avgWin" n>Avg win</Th><Th k="avgLoss" n>Avg loss</Th><Th k="openLoss" n>Open loss held</Th></tr></thead>
        <tbody>{sorted.map((r) => <tr key={r.strategy}><td><b>{r.strategy}</b></td><td className="n">{r.count}</td><td className="n">{r.winRate !== null ? r.winRate.toFixed(0) + '%' : '—'}</td>
          <td className={'n ' + toneOf(r.gross)}>{fmtSigned(r.gross)}</td><td className={'n ' + toneOf(r.net)}>{fmtSigned(r.net)}</td><td className="n pos">{fmtINR(r.avgWin)}</td><td className="n neg">{fmtINR(r.avgLoss)}</td>
          <td className={'n ' + toneOf(r.openLoss)}>{r.openLoss ? fmtINR(r.openLoss) : '—'}</td></tr>)}</tbody>
      </table></div>
    </Card>
  );
}

function Churn({ ledger }) {
  const intra = ledger.closedTrades.filter((t) => t.intraday);
  const gross = sum(intra, (t) => t.pnl), ch = sum(intra, (t) => t.charges), net = gross - ch;
  return (
    <Card title="Churn (intraday round-trips)">
      <div className="kpis">
        <KpiCard label="Round-trips" value={intra.length} hint={`${ledger.closedTrades.length ? ((intra.length / ledger.closedTrades.length) * 100).toFixed(0) : 0}% of closed trades`} />
        <KpiCard label="Gross intraday P&L" value={fmtSigned(gross)} tone={toneOf(gross)} />
        <KpiCard label="Charges drag" value={fmtINR(ch)} tone={ch ? 'warn' : ''} hint={gross ? `${Math.abs((ch / gross) * 100).toFixed(0)}% of gross` : ''} />
        <KpiCard label="Net leak" value={fmtSigned(net)} tone={toneOf(net)} hint="gross − charges" />
      </div>
    </Card>
  );
}

/* ------------------------------------------------------- simulator */
const SCENARIO_TYPES = {
  sl1r: { label: 'Fixed stop at −1R', param: 'R as % of entry (if no stop-loss)', def: 2 },
  skipDay: { label: 'Skip a weekday', param: 'Weekday (entry day)', def: 1 },
  holdWinners: { label: 'Hold winners +N days', param: 'Extra days', def: 5 },
  skipStreak: { label: 'Pause after loss streak', param: 'Losses in a row (skip next trade)', def: 2 },
  capSize: { label: 'Cap position size', param: 'Max ₹ per trade', def: 100000 },
};

function runScenario(trades, sc, candles) {
  const out = []; let streak = 0, skipNext = 0, missing = 0, changed = 0;
  const p = num(sc.param);
  trades.forEach((t) => {
    let pnl = t.pnl, take = true;
    if (sc.type === 'skipDay' && t.entryWeekday === p) take = false;
    if (sc.type === 'skipStreak') { if (skipNext > 0) { take = false; skipNext--; } }
    if (take && sc.type === 'sl1r') {
      const R = isNum(t.stopLoss) ? Math.abs(t.entryPrice - t.stopLoss) * t.qty : (t.entryValue * (isNum(p) ? p : 2)) / 100;
      if (pnl < -R) { pnl = -R; changed++; }
    }
    if (take && sc.type === 'capSize' && isNum(p) && p > 0 && t.entryValue > p) { pnl = pnl * (p / t.entryValue); changed++; }
    if (take && sc.type === 'holdWinners' && t.pnl > 0) {
      const cs = candles[t.posKey] || candles[t.symbol];
      if (cs?.length) {
        const target = fromDayNum(dayNum(t.exitDate) + (isNum(p) ? p : 0));
        const c = cs.find((x) => x.time >= target);
        if (c) { pnl = (c.close - t.entryPrice) * t.qty * t.dir; changed++; } else missing++;
      } else missing++;
    }
    if (!take) { changed++; return; }
    out.push({ ...t, pnl });
    if (sc.type === 'skipStreak') { streak = pnl < 0 ? streak + 1 : 0; if (streak >= (isNum(p) ? p : 2)) { skipNext = 1; streak = 0; } }
  });
  let cum = 0, peak = 0, mdd = 0;
  out.forEach((t) => { cum += t.pnl; peak = Math.max(peak, cum); mdd = Math.min(mdd, cum - peak); });
  return { total: cum, n: out.length, winRate: out.length ? (out.filter((t) => t.pnl > 0).length / out.length) * 100 : null, mdd, missing, changed };
}

function Simulator({ ledger, candles, riskPct }) {
  const T = useTok();
  const [scs, setScs] = useState(() => [
    { id: uid(), type: 'sl1r', param: riskPct || 2 }, { id: uid(), type: 'skipDay', param: 1 },
    { id: uid(), type: 'skipStreak', param: 2 }, { id: uid(), type: 'capSize', param: 100000 },
  ]);
  const trades = ledger.closedTrades;
  const actual = useMemo(() => runScenario(trades, { type: 'none' }, candles), [trades, candles]);
  const results = useMemo(() => scs.map((s) => ({ ...s, r: runScenario(trades, s, candles) })), [scs, trades, candles]);
  const upd = (id, k, v) => setScs(scs.map((s) => (s.id === id ? { ...s, [k]: v, ...(k === 'type' ? { param: SCENARIO_TYPES[v].def } : {}) } : s)));
  const chart = [{ name: 'Actual', total: actual.total }, ...results.map((s, i) => ({ name: `S${i + 1}`, total: s.r.total }))];
  if (!trades.length) return <div className="empty"><Icon name="FlaskConical" size={26} /><div>The simulator replays closed trades. Nothing has been closed yet.</div></div>;
  return (
    <div className="stack">
      <Card title="Scenarios" right={<button className="btn sm" disabled={scs.length >= 6} onClick={() => setScs([...scs, { id: uid(), type: 'holdWinners', param: 5 }])}><Icon name="Plus" size={14} /> Add scenario</button>}>
        <div className="stack" style={{ gap: 8 }}>
          {scs.map((s, i) => (
            <div key={s.id} className="row">
              <span className="mono acc" style={{ width: 26 }}>S{i + 1}</span>
              <select className="f" style={{ width: 'auto', flex: '1 1 200px' }} id={`sc-type-${s.id}`} aria-label="Scenario rule" value={s.type} onChange={(e) => upd(s.id, 'type', e.target.value)}>
                {Object.entries(SCENARIO_TYPES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select>
              {s.type === 'skipDay'
                ? <select className="f" style={{ width: 'auto', flex: '1 1 140px' }} id={`sc-p-${s.id}`} aria-label={SCENARIO_TYPES[s.type].param} value={s.param} onChange={(e) => upd(s.id, 'param', +e.target.value)}>{WEEKDAYS.map((d, k) => <option key={k} value={k}>{d}</option>)}</select>
                : <input className="f mono" style={{ width: 'auto', flex: '1 1 140px' }} id={`sc-p-${s.id}`} aria-label={SCENARIO_TYPES[s.type].param} title={SCENARIO_TYPES[s.type].param} inputMode="decimal" value={s.param} onChange={(e) => upd(s.id, 'param', e.target.value)} />}
              <span className="tiny muted" style={{ flex: '1 1 160px' }}>{SCENARIO_TYPES[s.type].param}</span>
              <button className="iconbtn" aria-label="Remove scenario" onClick={() => setScs(scs.filter((x) => x.id !== s.id))}><Icon name="Trash2" size={14} /></button>
            </div>
          ))}
        </div>
      </Card>
      <div className="grid2">
        <Card title="Total realized P&L">
          <div className="chartbox sm">
            <ResponsiveContainer>
              <BarChart data={chart} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid stroke={T.border} strokeDasharray="2 4" vertical={false} />
                <XAxis dataKey="name" {...axisProps(T)} /><YAxis {...axisProps(T)} tickFormatter={compactINR} width={62} />
                <Tooltip {...tipStyle(T)} cursor={{ fill: T.card2 }} formatter={(v) => [fmtSigned(v), 'P&L']} />
                <ReferenceLine y={0} stroke={T.border} /><ReferenceLine y={actual.total} stroke={T.accent} strokeDasharray="4 4" />
                <Bar dataKey="total" radius={[3, 3, 0, 0]} isAnimationActive={false}>{chart.map((d, i) => <Cell key={i} fill={i === 0 ? T.accent : d.total >= actual.total ? T.pos : T.neg} />)}</Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>
        <Card title="Side by side">
          <div className="tablewrap"><table className="t">
            <thead><tr><th>Book</th><th className="n">P&amp;L</th><th className="n">Δ vs actual</th><th className="n">Trades</th><th className="n">Win %</th><th className="n">Max DD</th></tr></thead>
            <tbody>
              <tr><td><b className="acc">Actual</b></td><td className={'n ' + toneOf(actual.total)}>{fmtSigned(actual.total)}</td><td className="n muted">—</td><td className="n">{actual.n}</td><td className="n">{actual.winRate?.toFixed(0)}%</td><td className="n neg">{fmtINR(actual.mdd)}</td></tr>
              {results.map((s, i) => { const d = s.r.total - actual.total; return (
                <tr key={s.id}><td><span className="mono acc">S{i + 1}</span> <span className="small">{SCENARIO_TYPES[s.type].label}{s.type === 'skipDay' ? ` (${WEEKDAYS[s.param]})` : ''}</span>
                  {s.r.missing > 0 && <div className="tiny warn">{s.r.missing} winners had no later prices, left unchanged</div>}</td>
                  <td className={'n ' + toneOf(s.r.total)}>{fmtSigned(s.r.total)}</td><td className={'n ' + toneOf(d)}>{fmtSigned(d)}</td><td className="n">{s.r.n}</td>
                  <td className="n">{s.r.winRate !== null ? s.r.winRate.toFixed(0) + '%' : '—'}</td><td className="n neg">{fmtINR(s.r.mdd)}</td></tr>); })}
            </tbody>
          </table></div>
        </Card>
      </div>
      <div className="tiny muted">Replays your {trades.length} closed trades in close-date order, gross of charges. Nothing in your book is changed. “Hold winners” needs OHLC candles for the symbol; “Pause after loss streak” skips the one trade that follows the streak.</div>
    </div>
  );
}

function seedSources() {
  if (!SEED_DATA) return [];
  try {
    const { rows, prices, candles } = extractPayload(SEED_DATA);

  } catch (e) { console.error('SEED_DATA could not be read', e); return []; }

function App() {
  const [theme, setTheme] = useState('dark');
  const [tokens, setTokens] = useState(null);
  const [tab, setTab] = useState(() => { const h = location.hash.replace('#', ''); return TABS.some((t) => t.id === h) ? h : 'overview'; });
  const [sources, setSources] = useState(seedSources);
  const [manual, setManual] = useState([]);
  const [remarks, setRemarks] = useState({});
  const [cmpOverrides, setCmpOverrides] = useState({});
  const [settings, setSettings] = useState({ startCapital: '', startDate: '', portfolioOverride: '', flows: [], chargeRate: '0', riskPct: '2' });
  const [apiCfg, setApiCfg] = useState({ baseUrl: '', path: '/trades?from={from}&to={to}', auth: 'bearer', headerName: 'x-api-key', token: '', from: '', to: '' });
  const [panel, setPanel] = useState(null); // 'settings' | 'api' | 'columns'
  const [dragging, setDragging] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); setTokens(readTokens()); }, [theme]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 4500); return () => clearTimeout(t); }, [toast]);

  const addFiles = useCallback(async (files) => {
    const added = [], bad = [];
    for (const file of files) {
      try {
        const text = await readFileText(file);
        const raw = rawFromCSV(text);
        if (!raw.rows.length) { bad.push(file.name); continue; }
        added.push(makeSource({ kind: 'csv', name: file.name || String(file), raw }));
      } catch (e) { bad.push(file.name || String(file)); }
    }
    if (added.length) setSources((s) => [...s, ...added]);
    setToast(bad.length ? { kind: 'err', msg: `Could not read ${bad.join(', ')}. Is it a CSV with a header row?` } : { kind: 'ok', msg: `Loaded ${added.map((a) => `${a.name} (${a.raw.rows.length} rows)`).join(', ')}` });
  }, []);
  const readNamed = useCallback(async (name) => {
    try { const text = await window.fs.readFile(name, { encoding: 'utf8' }); setSources((s) => [...s, makeSource({ kind: 'csv', name, raw: rawFromCSV(text) })]); }
    catch (e) { setToast({ kind: 'err', msg: `Could not read ${name}` }); }
  }, []);
  const onFetched = useCallback(({ rows, prices, candles, name }) => {
    const src = makeSource({ kind: 'api', name, raw: rawFromObjects(rows), extra: { prices, candles } });
    setSources((s) => [...s, src]);
    return normalizeSource(src).fills.length;
  }, []);
  const loadSample = () => {
    const raw = makeSampleData();
    setSources((s) => [...s.filter((x) => x.kind !== 'sample'), makeSource({ kind: 'sample', name: 'Sample data', raw, extra: { candles: raw.candles } })]);
    setSettings((st) => ({ ...st, startCapital: st.startCapital || '1000000', startDate: st.startDate || '2025-10-01',
      flows: st.flows.length ? st.flows : [{ id: uid(), date: '2025-10-01', amount: '1000000', type: 'Pay-in' }, { id: uid(), date: '2026-03-02', amount: '250000', type: 'Pay-in' }, { id: uid(), date: '2026-07-15', amount: '150000', type: 'Payout' }] }));
  };
  useEffect(() => { if (LOAD_SAMPLE_ON_START && !SEED_DATA) loadSample(); }, []);

  // global drag-drop
  useEffect(() => {
    let depth = 0;
    const enter = (e) => { if (e.dataTransfer?.types?.includes('Files')) { depth++; setDragging(true); } };
    const leave = () => { depth = Math.max(0, depth - 1); if (!depth) setDragging(false); };
    const over = (e) => e.preventDefault();
    const drop = (e) => { e.preventDefault(); depth = 0; setDragging(false); if (e.dataTransfer?.files?.length) addFiles([...e.dataTransfer.files]); };
    window.addEventListener('dragenter', enter); window.addEventListener('dragleave', leave); window.addEventListener('dragover', over); window.addEventListener('drop', drop);
    return () => { window.removeEventListener('dragenter', enter); window.removeEventListener('dragleave', leave); window.removeEventListener('dragover', over); window.removeEventListener('drop', drop); };
  }, [addFiles]);

  /* ---- derived pipeline: sources → normalized fills → merged → ledger → metrics ---- */
  const normalized = useMemo(() => sources.map((s) => ({ src: s, ...normalizeSource(s) })), [sources]);
  const manualFills = useMemo(() => manual.map((m, i) => ({ source: 'manual', seq: i, symbol: m.symbol, side: m.side, qty: m.qty, price: m.price, date: m.date, time: '',
    series: '', exchange: '', instrument_type: '', expiry: '', strike: null, option_type: '', strategy: m.strategy, sector: m.sector, charges: null,
    current_price: NaN, prev_close: NaN, stop_loss: m.stop_loss, target: m.target, remarks: m.remarks, order_id: '', trade_id: `manual-${m.id}` })), [manual]);
  const merged = useMemo(() => mergeFills([...normalized, { fills: manualFills }]), [normalized, manualFills]);
  const prices = useMemo(() => Object.assign({}, ...sources.map((s) => s.extra?.prices || {})), [sources]);
  const candles = useMemo(() => Object.assign({}, ...sources.map((s) => s.extra?.candles || {})), [sources]);
  const ledger = useMemo(() => buildLedger(merged.fills, { chargeRate: num(settings.chargeRate) || 0, prices, cmpOverrides }), [merged, settings.chargeRate, prices, cmpOverrides]);

  const totals = useMemo(() => {
    const P = ledger.positions, C = ledger.closedTrades;
    const realized = sum(P, (p) => p.realized), unrealized = sum(P, (p) => p.unrealized), charges = sum(P, (p) => p.charges);
    const wins = C.filter((t) => t.pnl > 0).length, losses = C.filter((t) => t.pnl < 0).length;
    const open = P.filter((p) => p.openQty > 1e-9);
    return { realized, unrealized, total: realized + unrealized, charges, net: realized + unrealized - charges, wins, losses,
      winRate: C.length ? (wins / C.length) * 100 : null, openCount: open.length, invested: sum(open, (p) => p.openCost),
      openValue: sum(open, (p) => p.marketValue), missingCmp: open.filter((p) => !p.hasCmp).length };
  }, [ledger]);

  const returns = useMemo(() => {
    const allDates = merged.fills.map((f) => f.date).sort();
    const lastDate = allDates[allDates.length - 1];
    const endDate = totals.openCount ? todayStr() : lastDate;
    const sc = num(settings.startCapital), ov = num(settings.portfolioOverride);
    const endValue = isNum(ov) ? ov + totals.realized : (isNum(sc) ? sc + totals.total : NaN);
    const cagr = computeCAGR({ startCapital: sc, startDate: settings.startDate, endValue, endDate });
    const flows = settings.flows.filter((f) => f.date && num(f.amount) > 0).map((f) => ({ date: f.date, amount: f.type === 'Payout' ? num(f.amount) : -num(f.amount) }));
    const netIn = -sum(flows, (f) => f.amount);
    const portfolioValue = isNum(ov) ? ov : netIn + totals.total;
    const xirr = flows.length ? computeXIRR([...flows, { date: todayStr(), amount: portfolioValue }]) : { value: null, hint: 'Add pay-ins/payouts in Settings' };
    return { cagr, xirr, portfolioValue, flowCount: flows.length };
  }, [merged, totals, settings]);

  const stats = { fills: merged.fills.length, trades: ledger.closedTrades.length, symbols: new Set(merged.fills.map((f) => f.symbol)).size, dupes: merged.dupes };
  const chips = [
    ...normalized.map(({ src, fills }) => ({ id: src.id, kind: src.kind, name: src.name, count: fills.length, removable: true })),
    ...(manual.length ? [{ id: 'manual', kind: 'manual', name: 'Manual entries', count: manual.length, removable: true }] : []),
  ];
  const removeSource = (id) => { if (id === 'manual') setManual([]); else setSources((s) => s.filter((x) => x.id !== id)); };
  const hasData = merged.fills.length > 0;
  const go = (id) => { setTab(id); try { history.replaceState(null, '', '#' + id); } catch (e) {} window.scrollTo({ top: 0 }); };

  if (!tokens) return null;
  const current = TABS.find((t) => t.id === tab);
  return (
    <TokensCtx.Provider value={tokens}>
      <div className="app">
        <nav className="rail" aria-label="Sections">
          <div className="brand"><Icon name="Gauge" size={20} /><span>Trade<b>Ledger</b></span></div>
          {TABS.map((t) => <button key={t.id} className={'navbtn ' + (tab === t.id ? 'on' : '')} onClick={() => go(t.id)}><Icon name={t.icon} />{t.label}</button>)}
          <div className="spacer" />
          <button className="navbtn" onClick={() => setPanel('settings')}><Icon name="Settings" />Settings ▸ Capital</button>
          <button className="navbtn" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}><Icon name={theme === 'dark' ? 'Sun' : 'Moon'} />{theme === 'dark' ? 'Light mode' : 'Dark mode'}</button>
        </nav>
        <main className="main">
          <div className="topbar">
            <div className="title"><span className="label">Trading journal</span><h1 style={{ fontSize: 24 }}>{current.label}</h1></div>
            <div className="row">
              <button className="iconbtn" aria-label="Toggle theme" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}><Icon name={theme === 'dark' ? 'Sun' : 'Moon'} /></button>
              <button className="iconbtn" aria-label="Settings" onClick={() => setPanel('settings')}><Icon name="Settings" /></button>
            </div>
          </div>
          <DataSourceBar stats={stats} sources={chips} onRemove={removeSource} onUpload={addFiles} onApi={() => setPanel('api')} onMapping={() => setPanel('columns')} />
          {toast && <div className={'note ' + (toast.kind === 'err' ? 'err' : 'ok')}>{toast.msg}</div>}
          {sources.some((s) => s.kind === 'sample') && <div className="note info">Showing <b>sample data</b> (made-up example trades). Remove the “Sample data” chip (×) and upload your own CSV to replace it.</div>}
          {!hasData && tab !== 'journal' ? (
            <EmptyState onFiles={addFiles} apiCfg={apiCfg} setApiCfg={setApiCfg} onFetched={onFetched} onSample={loadSample} onReadNamed={readNamed} />
          ) : (
            <>
              {tab === 'overview' && <Overview ledger={ledger} totals={totals} returns={returns} onSettings={() => setPanel('settings')} />}
              {tab === 'holdings' && <Holdings ledger={ledger} cmpOverrides={cmpOverrides} setCmp={(k, v) => setCmpOverrides((o) => { const n = { ...o }; if (String(v).trim() === '') delete n[k]; else n[k] = v; return n; })} />}
              {tab === 'journal' && <Journal fills={merged.fills} ledger={ledger} remarks={remarks} setRemark={(k, v) => setRemarks((r) => ({ ...r, [k]: v }))} onFiles={addFiles}
                onAddManual={(m) => setManual((x) => [...x, { ...m, id: uid() }])} />}
              {tab === 'charts' && <Charts ledger={ledger} candles={candles} startCapital={num(settings.startCapital) || 0} />}
              {tab === 'mind' && <Mind ledger={ledger} />}
              {tab === 'simulator' && <Simulator ledger={ledger} candles={candles} riskPct={num(settings.riskPct)} />}
            </>
          )}
        </main>
        <nav className="bottomnav" aria-label="Sections">
          {TABS.map((t) => <button key={t.id} className={tab === t.id ? 'on' : ''} onClick={() => go(t.id)}><Icon name={t.icon} size={18} />{t.label}</button>)}
        </nav>
      </div>
      {panel === 'settings' && <Drawer title="Settings ▸ Capital" onClose={() => setPanel(null)}><SettingsCapital settings={settings} setSettings={setSettings} derived={returns} /></Drawer>}
      {panel === 'api' && <Drawer title="Connect API" onClose={() => setPanel(null)}><ApiConnectPanel cfg={apiCfg} setCfg={setApiCfg} onFetched={onFetched} /></Drawer>}
      {panel === 'columns' && <Drawer title="Detected schema" onClose={() => setPanel(null)}>
        {sources.length === 0 ? <div className="muted">No file or API sources loaded yet.</div> : normalized.map(({ src, fills, errors }) => (
          <SchemaEditor key={src.id} src={src} result={{ fills, errors }} onChange={(ns) => setSources((s) => s.map((x) => (x.id === ns.id ? ns : x)))} onRemove={() => removeSource(src.id)} />
        ))}
        <Card title="Expected columns"><ExpectedColumns /></Card>
      </Drawer>}
      {dragging && <div className="dropveil"><div>Drop CSV to import</div></div>}
    </TokensCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
