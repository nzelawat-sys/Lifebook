<script src="https://cdn.jsdelivr.net/npm/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>

<script type="text/babel" data-presets="react">
/* ==========================================================================
   SEED_DATA — paste JSON from your broker MCP connector here.
   Accepted shapes:
     [ {symbol, side, quantity, price, date, ...}, ... ]            (fills)
     [ {symbol, side, buy_price, sell_price, entry_date, ...}, ... ] (closed trades)
     { fills|trades|data: [...], prices: {SYMBOL: cmp}, candles: {SYMBOL: [{time,open,high,low,close}]} }
   ========================================================================== */
const SEED_DATA = null;
// When there is no SEED_DATA, open with made-up sample trades so every tab has something to show.
const LOAD_SAMPLE_ON_START = true;

const { useState, useMemo, useEffect, useRef, useCallback, Fragment } = React;
const {
  ResponsiveContainer, ComposedChart, BarChart, Bar, Line, Scatter, Area, XAxis, YAxis, CartesianGrid,
  Tooltip, ReferenceLine, PieChart, Pie, Cell, Legend,
} = Recharts;

/* ------------------------------------------------------------------ utils */
const Icon = ({ name, size = 16, className }) => {
  const C = LucideReact[name] || LucideReact.Circle;
  return <C size={size} strokeWidth={1.75} className={className} />;
};
const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
const sum = (arr, f = (x) => x) => arr.reduce((a, x, i) => a + (f(x, i) || 0), 0);
const uid = () => Math.random().toString(36).slice(2, 10);
const INR0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const INR2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtINR = (v, dp = 0) => (!isNum(v) ? '—' : (v < 0 ? '−₹' : '₹') + (dp ? INR2 : INR0).format(Math.abs(v)));
const fmtSigned = (v, dp = 0) => (!isNum(v) ? '—' : (v > 0 ? '+' : '') + fmtINR(v, dp));
const fmtNum = (v, dp = 2) => (!isNum(v) ? '—' : new Intl.NumberFormat('en-IN', { maximumFractionDigits: dp }).format(v));
const fmtPct = (v, dp = 1) => (!isNum(v) ? '—' : (v > 0 ? '+' : '') + v.toFixed(dp) + '%');
const toneOf = (v) => (!isNum(v) || Math.abs(v) < 1e-9 ? '' : v > 0 ? 'pos' : 'neg');
const compactINR = (v) => {
  if (!isNum(v)) return '—';
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e7) return s + '₹' + (a / 1e7).toFixed(2) + 'Cr';
  if (a >= 1e5) return s + '₹' + (a / 1e5).toFixed(2) + 'L';
  if (a >= 1e3) return s + '₹' + (a / 1e3).toFixed(1) + 'k';
  return s + '₹' + a.toFixed(0);
};

/* dates are kept as 'YYYY-MM-DD' strings; dayNum gives integer days for diffs */
const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
const dayNum = (s) => { if (!s) return NaN; const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const fromDayNum = (n) => { const d = new Date(n * 864e5); return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); };
const todayStr = () => { const d = new Date(); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
const weekdayOf = (s) => new Date(dayNum(s) * 864e5).getUTCDay();
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
const MON3 = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const fmtDate = (s) => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d} ${MON3[+m - 1] || m} ${y}`; };
const fmtDateShort = (s) => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; };

/* ------------------------------------------------------- value parsers */
function num(v) {
  if (v === null || v === undefined || v === '') return NaN;
  if (typeof v === 'number') return v;
  let s = String(v).trim();
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[₹$,\s%]/g, '').replace(/^rs\.?/i, '');
  const n = parseFloat(s);
  return Number.isFinite(n) ? (neg ? -n : n) : NaN;
}

function parseTime(s) {
  const m = String(s || '').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?/i);
  if (!m) return '';
  let h = +m[1];
  if (m[4]) { const pm = m[4].toLowerCase() === 'pm'; if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
  return `${pad2(h)}:${m[2]}:${m[3] || '00'}`;
}

/* returns {date:'YYYY-MM-DD', time:'HH:MM:SS'|''} or null */
function parseDate(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number' && v > 20000 && v < 80000) return { date: fromDayNum(Math.floor(v) - 25569), time: '' }; // Excel serial
  if (typeof v === 'number' && v > 1e11) { const d = new Date(v); return { date: ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()), time: `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}` }; }
  const s = String(v).trim();
  let m, y, mo, d;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = s.match(/^(\d{1,2})[-\/ .]([A-Za-z]{3,9})[-\/ .,]+(\d{2,4})/))) { d = +m[1]; mo = MONTHS[m[2].slice(0, 3).toLowerCase()]; y = +m[3]; }
  else if ((m = s.match(/^([A-Za-z]{3,9})[ -](\d{1,2}),?[ -](\d{4})/))) { mo = MONTHS[m[1].slice(0, 3).toLowerCase()]; d = +m[2]; y = +m[3]; }
  else if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) {
    d = +m[1]; mo = +m[2]; y = +m[3];
    if (mo > 12 && d <= 12) { const t = d; d = mo; mo = t; } // clearly MM/DD
  }
  else return null;
  if (y < 100) y += 2000;
  if (!mo || mo > 12 || !d || d > 31) return null;
  return { date: ymd(y, mo, d), time: parseTime(s.slice(m[0].length)) };
}

function parseSide(v, qtyRaw) {
  const s = String(v ?? '').trim().toUpperCase();
  if (['BUY', 'B', '1', 'LONG', 'BOT', 'BOUGHT', 'PURCHASE', 'P'].includes(s) || s.startsWith('BUY')) return 'BUY';
  if (['SELL', 'S', '-1', '2', 'SHORT', 'SLD', 'SOLD', 'SALE'].includes(s) || s.startsWith('SELL')) return 'SELL';
  if (isNum(qtyRaw) && qtyRaw < 0) return 'SELL';
  if (isNum(qtyRaw) && qtyRaw > 0 && !s) return 'BUY';
  return null;
}

function parseOptionType(v, symbol) {
  const s = String(v ?? '').trim().toUpperCase();
  if (['CE', 'CALL', 'C'].includes(s)) return 'CE';
  if (['PE', 'PUT', 'P'].includes(s)) return 'PE';
  const m = String(symbol || '').toUpperCase().match(/\d(CE|PE)$/);
  return m ? m[1] : '';
}

/* ------------------------------------------------- schema / normalizer */
const normKey = (s) => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');

const COMMON_FIELDS = {
  series: ['series'],
  exchange: ['exchange', 'exch', 'segment', 'exchangesegment', 'market'],
  instrument_type: ['instrumenttype', 'instrtype', 'instrument_type', 'assetclass', 'securitytype'],
  expiry: ['expiry', 'expirydate', 'exp', 'expdate'],
  strike: ['strike', 'strikeprice', 'strk'],
  option_type: ['optiontype', 'opttype', 'cepe', 'callput', 'right', 'optype'],
  strategy: ['strategy', 'setup', 'tag', 'playbook', 'strategyname'],
  sector: ['sector', 'industry'],
  charges: ['charges', 'totalcharges', 'brokerage', 'fees', 'commission', 'taxes', 'cost'],
  current_price: ['currentprice', 'cmp', 'ltp', 'lastprice', 'marketprice', 'lasttradedprice'],
  prev_close: ['prevclose', 'previousclose', 'closeprice', 'yesterdayclose'],
  stop_loss: ['stoploss', 'sl', 'stop', 'stopprice'],
  target: ['target', 'tgt', 'targetprice'],
  remarks: ['remarks', 'notes', 'note', 'comment', 'comments', 'journal'],
};
const FILL_FIELDS = {
  symbol: ['symbol', 'tradingsymbol', 'scrip', 'scripname', 'ticker', 'instrument', 'stock', 'securityname', 'sym', 'name', 'scripcode'],
  side: ['side', 'transactiontype', 'buysell', 'buyorsell', 'tradetype', 'action', 'bs', 'txntype', 'transaction', 'direction', 'type'],
  quantity: ['quantity', 'qty', 'filledqty', 'tradedqty', 'tradequantity', 'quantitytraded', 'shares', 'units', 'filledquantity', 'netqty', 'volume'],
  price: ['price', 'tradeprice', 'avgprice', 'averageprice', 'executionprice', 'fillprice', 'tradedprice', 'rate', 'netrate', 'avgtradedprice'],
  date: ['date', 'tradedate', 'orderdate', 'executiondate', 'filldate', 'transactiondate', 'datetime', 'timestamp', 'orderexecutiontime', 'tradedatetime', 'tradetimestamp'],
  time: ['time', 'tradetime', 'ordertime', 'executiontime', 'filltime', 'exchangetime'],
  order_id: ['orderid', 'orderno', 'ordernumber', 'orderref'],
  trade_id: ['tradeid', 'tradeno', 'tradenumber', 'fillid', 'executionid', 'exchtradeid'],
  ...COMMON_FIELDS,
};
const TRADE_FIELDS = {
  symbol: FILL_FIELDS.symbol,
  side: ['side', 'direction', 'position', 'longshort', 'type', 'tradetype', 'action'],
  quantity: ['quantity', 'qty', 'shares', 'units'],
  buy_quantity: ['buyquantity', 'buyqty', 'qtybought', 'boughtqty', 'entryqty', 'entryquantity'],
  buy_price: ['buyprice', 'avgbuyprice', 'buyavg', 'buyavgprice', 'entryprice', 'avgentry', 'entry'],
  sell_quantity: ['sellquantity', 'sellqty', 'qtysold', 'soldqty', 'exitqty', 'exitquantity'],
  sell_price: ['sellprice', 'avgsellprice', 'sellavg', 'sellavgprice', 'exitprice', 'avgexit', 'exit'],
  entry_date: ['entrydate', 'buydate', 'opendate', 'entrytime', 'entrydatetime', 'opened', 'dateopened'],
  exit_date: ['exitdate', 'selldate', 'closedate', 'exittime', 'exitdatetime', 'closed', 'dateclosed'],
  pnl: ['pnl', 'profitloss', 'realizedpnl', 'realisedpnl', 'netpnl', 'pl', 'profit', 'grosspnl'],
  return_pct: ['returnpct', 'returnpercent', 'return', 'pnlpct', 'pnlpercent', 'roi', 'changepct'],
  status: ['status', 'state', 'tradestatus'],
  ...COMMON_FIELDS,
};
const REQUIRED = { fill: ['symbol', 'side', 'quantity', 'price', 'date'], trade: ['symbol', 'buy_price', 'entry_date'] };
const POSITIONAL = {
  fill: ['symbol', 'side', 'quantity', 'price', 'date', 'time'],
  trade: ['symbol', 'side', 'buy_quantity', 'buy_price', 'sell_quantity', 'sell_price', 'entry_date', 'exit_date', 'pnl'],
};
const fieldsFor = (shape) => (shape === 'trade' ? TRADE_FIELDS : FILL_FIELDS);

function headerLooksLikeData(headers) {
  let hits = 0;
  headers.forEach((h) => { if (isNum(num(h)) || parseDate(h)) hits++; });
  return hits >= 2;
}

function detectShape(headers) {
  const keys = headers.map(normKey);
  const tradeOnly = ['buy_price', 'sell_price', 'entry_date', 'exit_date', 'buy_quantity', 'sell_quantity', 'pnl'];
  let score = 0;
  tradeOnly.forEach((f) => { if (TRADE_FIELDS[f].some((syn) => keys.includes(syn))) score++; });
  return score >= 2 ? 'trade' : 'fill';
}

/* mapping: { field: { col: index|-1, how: 'exact'|'fuzzy'|'positional'|'manual'|'none' } } */
function autoMap(headers, shape, headerless) {
  const defs = fieldsFor(shape);
  const keys = headers.map(normKey);
  const used = new Set();
  const map = {};
  Object.keys(defs).forEach((f) => (map[f] = { col: -1, how: 'none' }));
  if (headerless) {
    POSITIONAL[shape].forEach((f, i) => { if (i < headers.length) { map[f] = { col: i, how: 'positional' }; used.add(i); } });
    return map;
  }
  // pass 1: exact synonym match in synonym priority order
  Object.entries(defs).forEach(([f, syns]) => {
    for (const syn of syns) {
      const i = keys.findIndex((k, idx) => k === syn && !used.has(idx));
      if (i >= 0) { map[f] = { col: i, how: 'exact' }; used.add(i); break; }
    }
  });
  // pass 2: header contains a (longish) synonym
  Object.entries(defs).forEach(([f, syns]) => {
    if (map[f].col >= 0) return;
    for (const syn of syns) {
      if (syn.length < 4) continue;
      const i = keys.findIndex((k, idx) => !used.has(idx) && k.includes(syn));
      if (i >= 0) { map[f] = { col: i, how: 'fuzzy' }; used.add(i); break; }
    }
  });
  // pass 3: positional fallback for required fields still missing
  POSITIONAL[shape].forEach((f, i) => {
    if (REQUIRED[shape].includes(f) && map[f].col < 0 && i < headers.length && !used.has(i)) { map[f] = { col: i, how: 'positional' }; used.add(i); }
  });
  return map;
}

/* raw table: {headers:[...], rows:[[...]], headerless:bool} */
function rawFromCSV(text) {
  const res = Papa.parse(text.replace(/^﻿/, ''), { header: false, skipEmptyLines: 'greedy', dynamicTyping: false });
  let rows = res.data.filter((r) => r.some((c) => String(c).trim() !== ''));
  if (!rows.length) return { headers: [], rows: [], headerless: false };
  const first = rows[0].map((c) => String(c).trim());
  const headerless = headerLooksLikeData(first);
  const headers = headerless ? first.map((_, i) => `col${i + 1}`) : first;
  return { headers, rows: headerless ? rows : rows.slice(1), headerless };
}
function rawFromObjects(objs) {
  const headers = [];
  objs.forEach((o) => Object.keys(o || {}).forEach((k) => { const v = o[k]; if ((v === null || typeof v !== 'object') && !headers.includes(k)) headers.push(k); }));
  return { headers, rows: objs.map((o) => headers.map((h) => (o?.[h] ?? ''))), headerless: false };
}

function makeSource({ kind, name, raw, extra }) {
  const shape = detectShape(raw.headers);
  return { id: uid(), kind, name, raw, shape, mapping: autoMap(raw.headers, shape, raw.headerless), extra: extra || {}, loadedAt: new Date().toISOString() };
}

/* Fill schema (internal):
   {id, key, source, seq, symbol, side, qty, price, date, time, series, exchange, instrument_type,
    expiry, strike, option_type, strategy, sector, charges, current_price, prev_close, stop_loss, target,
    remarks, order_id, trade_id, reported_pnl} */
function normalizeSource(src) {
  const { raw, shape, mapping } = src;
  const fills = [], errors = [];
  const get = (row, f) => { const m = mapping[f]; return m && m.col >= 0 ? row[m.col] : undefined; };
  const str = (v) => (v === undefined || v === null ? '' : String(v).trim());
  const common = (row, symbol) => {
    const exp = parseDate(get(row, 'expiry'));
    const strike = num(get(row, 'strike'));
    return {
      series: str(get(row, 'series')).toUpperCase(),
      exchange: str(get(row, 'exchange')).toUpperCase(),
      instrument_type: str(get(row, 'instrument_type')).toUpperCase(),
      expiry: exp ? exp.date : '',
      strike: isNum(strike) && strike > 0 ? strike : null,
      option_type: parseOptionType(get(row, 'option_type'), symbol),
      strategy: str(get(row, 'strategy')),
      sector: str(get(row, 'sector')),
      current_price: num(get(row, 'current_price')),
      prev_close: num(get(row, 'prev_close')),
      stop_loss: num(get(row, 'stop_loss')),
      target: num(get(row, 'target')),
      remarks: str(get(row, 'remarks')),
    };
  };
  const rowsArr = raw.rows;
  // broker exports are often newest-first: if so, process in reverse so same-day ties keep chronological order
  let order = rowsArr.map((_, i) => i);
  if (shape === 'fill' && mapping.date.col >= 0 && rowsArr.length > 1) {
    const a = parseDate(rowsArr[0][mapping.date.col]), b = parseDate(rowsArr[rowsArr.length - 1][mapping.date.col]);
    if (a && b && a.date > b.date) order = order.reverse();
  }
  order.forEach((ri, seqIdx) => {
    const row = rowsArr[ri];
    const symbol = str(get(row, 'symbol')).toUpperCase();
    if (!symbol) { errors.push({ row: ri + 1, reason: 'missing symbol' }); return; }
    if (shape === 'fill') {
      const qRaw = num(get(row, 'quantity'));
      const side = parseSide(get(row, 'side'), qRaw);
      const price = num(get(row, 'price'));
      const dt = parseDate(get(row, 'date'));
      if (!side) { errors.push({ row: ri + 1, reason: `unknown side "${str(get(row, 'side'))}"` }); return; }
      if (!isNum(qRaw) || qRaw === 0) { errors.push({ row: ri + 1, reason: 'bad quantity' }); return; }
      if (!isNum(price)) { errors.push({ row: ri + 1, reason: 'bad price' }); return; }
      if (!dt) { errors.push({ row: ri + 1, reason: `unparsed date "${str(get(row, 'date'))}"` }); return; }
      const t = parseTime(get(row, 'time')) || dt.time;
      const ch = num(get(row, 'charges'));
      fills.push({
        source: src.id, seq: seqIdx, symbol, side, qty: Math.abs(qRaw), price, date: dt.date, time: t,
        charges: isNum(ch) ? Math.abs(ch) : null, order_id: str(get(row, 'order_id')), trade_id: str(get(row, 'trade_id')),
        ...common(row, symbol),
      });
    } else {
      const sideRaw = str(get(row, 'side')).toUpperCase();
      const short = ['SHORT', 'SELL', 'S', '-1'].includes(sideRaw);
      const q = num(get(row, 'quantity'));
      let bq = num(get(row, 'buy_quantity')); if (!isNum(bq)) bq = q;
      let sq = num(get(row, 'sell_quantity')); if (!isNum(sq)) sq = q;
      const bp = num(get(row, 'buy_price')), sp = num(get(row, 'sell_price'));
      const ed = parseDate(get(row, 'entry_date')), xd = parseDate(get(row, 'exit_date'));
      const status = str(get(row, 'status')).toUpperCase();
      const isOpen = status === 'OPEN' || !xd;
      if (!ed) { errors.push({ row: ri + 1, reason: 'unparsed entry date' }); return; }
      const ch = num(get(row, 'charges')), pnl = num(get(row, 'pnl'));
      const c = common(row, symbol);
      const [entrySide, entryQ, entryP, exitSide, exitQ, exitP] = short ? ['SELL', sq, sp, 'BUY', bq, bp] : ['BUY', bq, bp, 'SELL', sq, sp];
      if (!isNum(entryQ) || entryQ <= 0 || !isNum(entryP)) { errors.push({ row: ri + 1, reason: 'missing entry qty/price' }); return; }
      fills.push({ source: src.id, seq: seqIdx * 2, symbol, side: entrySide, qty: Math.abs(entryQ), price: entryP, date: ed.date, time: ed.time,
        charges: isOpen && isNum(ch) ? Math.abs(ch) : null, order_id: '', trade_id: `row${ri + 1}-in`, ...c });
      if (!isOpen && isNum(exitQ) && exitQ > 0 && isNum(exitP)) {
        fills.push({ source: src.id, seq: seqIdx * 2 + 1, symbol, side: exitSide, qty: Math.abs(exitQ), price: exitP, date: xd.date, time: xd.time,
          charges: isNum(ch) ? Math.abs(ch) : null, order_id: '', trade_id: `row${ri + 1}-out`, reported_pnl: isNum(pnl) ? pnl : null, ...c, remarks: '' });
      }
    }
  });
  return { fills, errors };
}

/* identity used for de-duplication across sources (and for remarks) */
const fillIdentity = (f) => (f.trade_id && !/^row\d+-/.test(f.trade_id)
  ? `T|${f.exchange}|${f.trade_id}`
  : `F|${f.symbol}|${f.expiry}|${f.strike ?? ''}|${f.option_type}|${f.side}|${f.qty}|${f.price}|${f.date}|${f.time}`);

/* merge all sources: an identity appearing k times in one source is k real fills; across sources we keep max(k) */
function mergeFills(perSource) {
  const best = new Map(); // identity -> {count, fills}
  perSource.forEach(({ fills }) => {
    const local = new Map();
    fills.forEach((f) => { const id = fillIdentity(f); if (!local.has(id)) local.set(id, []); local.get(id).push(f); });
    local.forEach((arr, id) => { const cur = best.get(id); if (!cur || arr.length > cur.length) best.set(id, arr); });
  });
  const out = [];
  best.forEach((arr, id) => arr.forEach((f, i) => out.push({ ...f, key: i ? `${id}#${i}` : id })));
  let dupes = sum(perSource, (s) => s.fills.length) - out.length;
  return { fills: out, dupes };
}

/* ------------------------------------------------------- FIFO ledger */
const isDerivative = (f) => !!(f.expiry || f.strike || f.option_type);
const positionKey = (f) => (isDerivative(f) ? `${f.symbol}|${f.expiry}|${f.strike ?? ''}|${f.option_type}` : f.symbol);
const positionLabel = (f) => (isDerivative(f) ? [f.symbol, f.expiry ? fmtDate(f.expiry).slice(0, 6) : '', f.strike ?? '', f.option_type].filter(Boolean).join(' ') : f.symbol);
const instrumentKind = (f) => {
  if (f.option_type) return 'OPT';
  if (f.expiry) return 'FUT';
  return f.instrument_type && !['EQ', 'EQUITY', 'STOCK', 'STK', 'CASH'].includes(f.instrument_type) ? f.instrument_type : 'EQ';
};
const mode = (arr) => { const c = {}; arr.filter(Boolean).forEach((x) => (c[x] = (c[x] || 0) + 1)); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || ''; };

function buildLedger(fills, { chargeRate = 0, prices = {}, cmpOverrides = {} } = {}) {
  const groups = new Map();
  fills.forEach((f) => { const k = positionKey(f); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(f); });
  const positions = [], closedTrades = [], fillRealized = {}, fillCharges = {};
  const today = todayStr();

  groups.forEach((gf, key) => {
    gf.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) || a.source.localeCompare(b.source) || a.seq - b.seq);
    const lots = [];
    const matches = [];
    let buyQty = 0, buyVal = 0, sellQty = 0, sellVal = 0, charges = 0, chargesEstimated = false;
    gf.forEach((f) => {
      const ch = isNum(f.charges) ? f.charges : (f.qty * f.price * chargeRate) / 100;
      if (!isNum(f.charges) && chargeRate > 0) chargesEstimated = true;
      fillCharges[f.key] = ch; charges += ch;
      const dir = f.side === 'BUY' ? 1 : -1;
      if (dir === 1) { buyQty += f.qty; buyVal += f.qty * f.price; } else { sellQty += f.qty; sellVal += f.qty * f.price; }
      let rem = f.qty;
      while (rem > 1e-9 && lots.length && lots[0].dir !== dir) {
        const lot = lots[0];
        const m = Math.min(lot.qty, rem);
        const pnl = lot.dir === 1 ? (f.price - lot.price) * m : (lot.price - f.price) * m;
        matches.push({ entry: lot.fill, exit: f, qty: m, entryPrice: lot.price, exitPrice: f.price, dir: lot.dir, pnl,
          entryDate: lot.fill.date, exitDate: f.date, entryChargeShare: (fillCharges[lot.fill.key] || 0) * (m / lot.fill.qty) });
        fillRealized[f.key] = (fillRealized[f.key] || 0) + pnl;
        lot.qty -= m; rem -= m;
        if (lot.qty <= 1e-9) lots.shift();
      }
      if (rem > 1e-9) lots.push({ qty: rem, price: f.price, dir, fill: f });
    });

    const first = gf[0], last = gf[gf.length - 1];
    const label = positionLabel(first);
    const strategy = mode(gf.map((f) => f.strategy));
    const sector = mode(gf.map((f) => f.sector));
    const realized = sum(matches, (m) => m.pnl);
    const openQtySigned = sum(lots, (l) => l.qty * l.dir);
    const openQty = Math.abs(openQtySigned);
    const openDir = openQtySigned >= 0 ? 1 : -1;
    const openCost = sum(lots, (l) => l.qty * l.price);
    const avgOpen = openQty > 1e-9 ? openCost / openQty : null;
    const fillCmp = [...gf].reverse().find((f) => isNum(f.current_price))?.current_price;
    const prevClose = [...gf].reverse().find((f) => isNum(f.prev_close))?.prev_close;
    const cmp = isNum(num(cmpOverrides[key])) ? num(cmpOverrides[key]) : isNum(prices[key]) ? prices[key] : isNum(prices[first.symbol]) && !isDerivative(first) ? prices[first.symbol] : isNum(fillCmp) ? fillCmp : null;
    const hasCmp = isNum(cmp) && openQty > 1e-9;
    const unrealized = hasCmp ? sum(lots, (l) => (cmp - l.price) * l.qty * l.dir) : 0;
    const marketValue = openQty > 1e-9 ? (hasCmp ? cmp * openQty : openCost) : 0;
    const todayMtm = hasCmp && isNum(prevClose) ? (cmp - prevClose) * openQtySigned : null;
    const total = realized + unrealized;
    const basis = first.side === 'SELL' && sellVal > 0 ? sellVal : buyVal || sellVal; // entry-side value
    // integrity: realized must equal Σsells − Σbuys + remaining long cost − remaining short proceeds
    const longOpenCost = sum(lots.filter((l) => l.dir === 1), (l) => l.qty * l.price);
    const shortOpenProceeds = sum(lots.filter((l) => l.dir === -1), (l) => l.qty * l.price);
    const integrityDiff = realized - (sellVal - buyVal + longOpenCost - shortOpenProceeds);
    const reported = gf.filter((f) => isNum(f.reported_pnl));
    const closeDates = matches.map((m) => m.exitDate).sort();
    const status = openQty > 1e-9 ? (matches.length ? 'PARTIAL' : 'OPEN') : 'CLOSED';

    positions.push({
      key, label, symbol: first.symbol, status, strategy, sector, fills: gf, lots, matches,
      kind: instrumentKind(first), expiry: first.expiry, strike: first.strike, option_type: first.option_type,
      buyQty, sellQty, avgBuy: buyQty ? buyVal / buyQty : null, avgSell: sellQty ? sellVal / sellQty : null, buyVal, sellVal,
      openQty, openQtySigned, openDir, openCost, avgOpen, cmp: isNum(cmp) ? cmp : null, hasCmp, marketValue, todayMtm,
      realized, unrealized, total, charges, chargesEstimated, net: total - charges,
      returnPct: basis ? (total / basis) * 100 : null,
      openReturnPct: openCost && hasCmp ? (unrealized / openCost) * 100 : null,
      openDate: first.date, closeDate: status === 'CLOSED' ? last.date : (closeDates[closeDates.length - 1] || null),
      firstOpenLotDate: lots[0]?.fill.date || null,
      daysHeld: lots[0] ? Math.max(0, dayNum(today) - dayNum(lots[0].fill.date)) : null,
      integrityDiff,
      reportedPnl: reported.length ? sum(reported, (f) => f.reported_pnl) : null,
    });

    // closed trades = matches grouped by the closing fill
    const byExit = new Map();
    matches.forEach((m) => { if (!byExit.has(m.exit.key)) byExit.set(m.exit.key, []); byExit.get(m.exit.key).push(m); });
    byExit.forEach((ms, exitKey) => {
      const exit = ms[0].exit;
      const qty = sum(ms, (m) => m.qty);
      const entryVal = sum(ms, (m) => m.entryPrice * m.qty);
      const wEntryDay = sum(ms, (m) => dayNum(m.entryDate) * m.qty) / qty;
      const holdDays = Math.max(0, Math.round(dayNum(exit.date) - wEntryDay));
      const firstEntry = ms.map((m) => m.entry).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
      const pnl = sum(ms, (m) => m.pnl);
      const tCharges = (fillCharges[exitKey] || 0) * (qty / exit.qty) + sum(ms, (m) => m.entryChargeShare);
      const stop = ms.map((m) => m.entry.stop_loss).find(isNum);
      closedTrades.push({
        id: exitKey, posKey: key, label, symbol: first.symbol, dir: ms[0].dir, qty,
        entryPrice: entryVal / qty, exitPrice: exit.price, entryValue: entryVal,
        entryDate: firstEntry.date, exitDate: exit.date, holdDays, intraday: holdDays === 0,
        pnl, pnlPct: entryVal ? (pnl / entryVal) * 100 : 0, charges: tCharges, net: pnl - tCharges,
        strategy: firstEntry.strategy || exit.strategy || strategy || 'Unassigned', sector: sector || '—',
        stopLoss: isNum(stop) ? stop : null, entryWeekday: weekdayOf(firstEntry.date),
      });
    });
  });

  closedTrades.sort((a, b) => a.exitDate.localeCompare(b.exitDate) || a.entryDate.localeCompare(b.entryDate));
  positions.sort((a, b) => (a.status === 'CLOSED') - (b.status === 'CLOSED') || Math.abs(b.total) - Math.abs(a.total));
  return { positions, closedTrades, fillRealized, fillCharges };
}

/* ------------------------------------------------------- returns */
function computeCAGR({ startCapital, startDate, endValue, endDate }) {
  if (!(startCapital > 0)) return { value: null, hint: 'Enter starting capital in Settings' };
  if (!startDate) return { value: null, hint: 'Enter a start date in Settings' };
  if (!isNum(endValue) || !endDate) return { value: null, hint: 'No trades yet' };
  const years = (dayNum(endDate) - dayNum(startDate)) / 365.25;
  if (!(years > 0)) return { value: null, hint: 'Start date must be before the latest date' };
  if (endValue <= 0) return { value: -1, years, endValue };
  return { value: Math.pow(endValue / startCapital, 1 / years) - 1, years, endValue, short: years < 0.25 };
}

/* flows: [{date:'YYYY-MM-DD', amount}] — negative = money in, positive = money out/current value */
function computeXIRR(flows) {
  const cf = flows.filter((f) => isNum(f.amount) && Math.abs(f.amount) > 1e-9 && f.date).sort((a, b) => a.date.localeCompare(b.date));
  if (cf.length < 2) return { value: null, hint: 'Needs at least one pay-in plus a current value' };
  if (!cf.some((f) => f.amount < 0) || !cf.some((f) => f.amount > 0)) return { value: null, hint: 'Needs both money in and money out/value' };
  const t0 = dayNum(cf[0].date);
  const ts = cf.map((f) => (dayNum(f.date) - t0) / 365);
  if (ts[ts.length - 1] <= 0) return { value: null, hint: 'All flows fall on one date' };
  const f = (r) => sum(cf, (c, i) => c.amount / Math.pow(1 + r, ts[i]));
  const df = (r) => sum(cf, (c, i) => (-ts[i] * c.amount) / Math.pow(1 + r, ts[i] + 1));
  let r = 0.1;
  for (let i = 0; i < 60; i++) {
    const fv = f(r), d = df(r);
    if (!isNum(fv) || !isNum(d) || d === 0) break;
    const next = r - fv / d;
    if (!isNum(next) || next <= -0.99 || next > 10) break;
    if (Math.abs(next - r) < 1e-9) return { value: next, method: 'newton' };
    r = next;
  }
  let lo = -0.99, hi = 10, flo = f(lo), fhi = f(hi);
  if (!isNum(flo) || !isNum(fhi) || flo * fhi > 0) return { value: null, hint: 'No solution in −99%…1000%' };
  for (let i = 0; i < 300; i++) {
    const mid = (lo + hi) / 2, fm = f(mid);
    if (Math.abs(fm) < 1e-7 || hi - lo < 1e-10) return { value: mid, method: 'bisection' };
    if (flo * fm < 0) { hi = mid; } else { lo = mid; flo = fm; }
  }
  return { value: (lo + hi) / 2, method: 'bisection' };
}

/* ------------------------------------------------------- sample data (clearly labelled) */
function makeSampleData() {
  let s = 20251001;
  const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
  const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) * 1.2;
  const days = [];
  for (let n = dayNum('2025-10-01'); n <= dayNum('2026-09-30'); n++) { const d = fromDayNum(n); const w = weekdayOf(d); if (w > 0 && w < 6) days.push(d); }
  const univ = [
    { symbol: 'RELIANCE', sector: 'Energy', p: 1380, strategy: 'Swing' }, { symbol: 'TCS', sector: 'IT', p: 3900, strategy: 'Positional' },
    { symbol: 'HDFCBANK', sector: 'Financials', p: 1650, strategy: 'Swing' }, { symbol: 'TATAMOTORS', sector: 'Auto', p: 980, strategy: 'Momentum' },
    { symbol: 'INFY', sector: 'IT', p: 1850, strategy: 'Positional' }, { symbol: 'ADANIENT', sector: 'Infra', p: 2950, strategy: 'Momentum' },
    { symbol: 'SBIN', sector: 'Financials', p: 780, strategy: 'Intraday' }, { symbol: 'ITC', sector: 'FMCG', p: 470, strategy: 'Intraday' },
  ];
  const candles = {};
  univ.forEach((u) => {
    let c = u.p; const arr = [];
    days.forEach((d) => {
      const o = c * (1 + gauss() * 0.004);
      c = Math.max(5, o * (1 + 0.0003 + gauss() * 0.015));
      const h = Math.max(o, c) * (1 + rnd() * 0.009), l = Math.min(o, c) * (1 - rnd() * 0.009);
      arr.push({ time: d, open: +o.toFixed(2), high: +h.toFixed(2), low: +l.toFixed(2), close: +c.toFixed(2) });
    });
    candles[u.symbol] = arr;
  });
  const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const brokerDate = (d) => { const [y, m, dd] = d.split('-'); return `${dd} ${MON[+m - 1]} ${y}`; };
  const rows = []; let oid = 1000;
  const push = (u, side, qty, price, d, time, last) => {
    const val = qty * price;
    const charges = u.strategy === 'Intraday' ? 20 + val * 0.00025 : val * 0.0011;
    rows.push([u.symbol, side, qty, price.toFixed(2), brokerDate(d), time, 'NSE', 'EQ', u.strategy, u.sector, `OD${oid++}`, `T${oid * 7}`, charges.toFixed(2),
      last ? last.close.toFixed(2) : '', last ? last.prev.toFixed(2) : '', '']);
  };
  const holdRange = { Intraday: [0, 0], Swing: [2, 12], Momentum: [1, 30], Positional: [15, 80] };
  univ.forEach((u, ui) => {
    const cs = candles[u.symbol];
    let i = 3 + Math.floor(rnd() * 15);
    const keepOpen = ui % 2 === 0;
    while (i < cs.length - 5) {
      const [a, b] = holdRange[u.strategy];
      const hold = a + Math.floor(rnd() * (b - a + 1));
      const qty = Math.max(1, Math.round((u.strategy === 'Intraday' ? 250000 : 120000) / cs[i].close));
      const remainingAfter = cs.length - (i + hold);
      if (remainingAfter < 3 && keepOpen) {
        const lastC = cs[cs.length - 1], prev = cs[cs.length - 2];
        push(u, 'BUY', qty, cs[i].close, cs[i].time, '10:05:00', { close: lastC.close, prev: prev.close });
        break;
      }
      if (i + hold >= cs.length) break;
      if (u.strategy === 'Intraday') {
        push(u, 'BUY', qty, cs[i].open, cs[i].time, '09:21:00');
        push(u, 'SELL', qty, cs[i].close, cs[i].time, '15:12:00');
        i += 2 + Math.floor(rnd() * 6);
      } else {
        push(u, 'BUY', qty, cs[i].close, cs[i].time, '10:05:00');
        if (hold > 6 && rnd() < 0.4) {
          const half = Math.floor(qty / 2), mid = i + Math.floor(hold / 2);
          push(u, 'SELL', half, cs[mid].close, cs[mid].time, '14:40:00');
          push(u, 'SELL', qty - half, cs[i + hold].close, cs[i + hold].time, '14:40:00');
        } else push(u, 'SELL', qty, cs[i + hold].close, cs[i + hold].time, '14:40:00');
        i += hold + 3 + Math.floor(rnd() * 14);
      }
    }
  });
  // one closed and one open index option
  const opt = (side, qty, price, d, time, strike, cmp, prev) => rows.push(['NIFTY', side, qty, price.toFixed(2), brokerDate(d), time, 'NFO', 'OPTIDX', 'Options', 'Index', `OD${oid++}`, `T${oid * 7}`, '45.00', cmp ? cmp.toFixed(2) : '', prev ? prev.toFixed(2) : '', '', '2026-10-27', String(strike), 'CE']);
  rows.forEach((r) => r.push('', '', ''));
  opt('BUY', 75, 142.5, days[days.length - 30], '11:02:00', 24800, null, null);
  opt('SELL', 75, 96.2, days[days.length - 26], '13:30:00', 24800, null, null);
  opt('BUY', 150, 182.5, days[days.length - 6], '10:30:00', 25000, 214.35, 198.1);
  rows.sort((a, b) => (parseDate(a[4]).date + a[5]).localeCompare(parseDate(b[4]).date + b[5]));
  const headers = ['Symbol', 'Trade Type', 'Quantity', 'Price', 'Trade Date', 'Time', 'Exchange', 'Series', 'Strategy', 'Sector', 'Order ID', 'Trade ID', 'Charges', 'LTP', 'Prev Close', 'Remarks', 'Expiry', 'Strike', 'Option Type'];
  return { headers, rows, headerless: false, candles };
}

function useSort(rows, initial, getters) {
  const [sort, setSort] = useState(initial);
  const sorted = useMemo(() => {
    if (!sort?.key) return rows;
    const g = getters[sort.key] || ((r) => r[sort.key]);
    return [...rows].sort((a, b) => {
      const x = g(a), y = g(b);
      const nx = x === null || x === undefined || x === '' || (typeof x === 'number' && !Number.isFinite(x));
      const ny = y === null || y === undefined || y === '' || (typeof y === 'number' && !Number.isFinite(y));
      if (nx && ny) return 0; if (nx) return 1; if (ny) return -1;
      const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y));
      return sort.dir === 'asc' ? c : -c;
    });
  }, [rows, sort, getters]);
  const toggle = (key) => setSort((s) => (s?.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'desc' }));
  const Th = ({ k, children, n }) => (
    <th className={'sortable ' + (n ? 'n' : '')} onClick={() => toggle(k)} aria-sort={sort?.key === k ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}>
      {children}{sort?.key === k ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : ''}
    </th>
  );
  return { sorted, Th, sort };
}

async function readFileText(file) {
  if (file && typeof file.text === 'function') return file.text();
  if (typeof file === 'string' && window.fs?.readFile) return window.fs.readFile(file, { encoding: 'utf8' });
  throw new Error('Cannot read this file');
}

function extractPayload(json) {
  const arr = Array.isArray(json) ? json
    : ['fills', 'trades', 'tradebook', 'data', 'orders', 'results', 'items', 'records'].map((k) => json?.[k]).find(Array.isArray)
      || (Array.isArray(json?.data?.trades) ? json.data.trades : null);
  const prices = {};
  const pr = json?.prices || json?.ltp || json?.quotes;
  if (Array.isArray(pr)) pr.forEach((p) => { const v = num(p.price ?? p.ltp ?? p.cmp ?? p.close); if (p.symbol && isNum(v)) prices[String(p.symbol).toUpperCase()] = v; });
  else if (pr && typeof pr === 'object') Object.entries(pr).forEach(([k, v]) => { const n = num(typeof v === 'object' ? v?.price ?? v?.ltp ?? v?.close : v); if (isNum(n)) prices[k.toUpperCase()] = n; });
  const candles = {};
  if (json?.candles && typeof json.candles === 'object') Object.entries(json.candles).forEach(([k, list]) => {
    if (!Array.isArray(list)) return;
    candles[k.toUpperCase()] = list.map((c) => {
      const d = parseDate(c.time ?? c.date ?? c.t ?? c[0]);
      return d && { time: d.date, open: num(c.open ?? c.o ?? c[1]), high: num(c.high ?? c.h ?? c[2]), low: num(c.low ?? c.l ?? c[3]), close: num(c.close ?? c.c ?? c[4]) };
    }).filter((c) => c && [c.open, c.high, c.low, c.close].every(isNum)).sort((a, b) => a.time.localeCompare(b.time));
  });
  return { rows: arr || [], prices, candles };
}

function ApiConnectPanel({ cfg, setCfg, onFetched }) {
  const [state, setState] = useState({ status: 'idle', msg: '' });
  const set = (k) => (e) => setCfg({ ...cfg, [k]: e.target.value });
  const buildUrl = () => {
    let p = cfg.path || '';
    p = p.replace('{from}', encodeURIComponent(cfg.from || '')).replace('{to}', encodeURIComponent(cfg.to || ''))
      .replace(/([?&]from=)(?=&|$)/, `$1${encodeURIComponent(cfg.from || '')}`).replace(/([?&]to=)(?=&|$)/, `$1${encodeURIComponent(cfg.to || '')}`);
    return cfg.baseUrl.replace(/\/+$/, '') + (p.startsWith('/') || !p ? p : '/' + p);
  };
  const run = async () => {
    if (!cfg.baseUrl) { setState({ status: 'error', msg: 'Enter a base URL first.' }); return; }
    const url = buildUrl();
    setState({ status: 'loading', msg: url });
    try {
      const headers = { Accept: 'application/json' };
      if (cfg.token) { if (cfg.auth === 'bearer') headers.Authorization = `Bearer ${cfg.token}`; else headers[cfg.headerName || 'x-api-key'] = cfg.token; }
      const res = await fetch(url, { headers });
      if (!res.ok) throw new Error(`Server answered ${res.status} ${res.statusText}`);
      const json = await res.json();
      const { rows, prices, candles } = extractPayload(json);
      if (!rows.length && !Object.keys(prices).length) throw new Error('The response had no trade rows (looked for an array, or a fills/trades/data key).');
      const n = onFetched({ rows, prices, candles, name: new URL(url).host });
      setState({ status: 'ok', msg: `Fetched ${n} trades` });
    } catch (e) {
      const blocked = e instanceof TypeError || /fetch|network|CSP|Content Security/i.test(String(e.message));
      setState({ status: 'error', msg: blocked
        ? 'The request was blocked before it reached the server. This page runs in a sandbox whose security policy (CSP/CORS) blocks most cross-origin calls. Use a CORS-enabled endpoint you control (your own backend or proxy), or paste the JSON into SEED_DATA instead.'
        : String(e.message || e) });
    }
  };
  return (
    <div className="stack">
      <div className="formgrid">
        <div className="field" style={{ gridColumn: '1 / -1' }}><label className="label" htmlFor="api-base">Base URL</label>
          <input id="api-base" className="f" placeholder="https://my-backend.example.com" value={cfg.baseUrl} onChange={set('baseUrl')} /></div>
        <div className="field" style={{ gridColumn: '1 / -1' }}><label className="label" htmlFor="api-path">Endpoint path</label>
          <input id="api-path" className="f mono" value={cfg.path} onChange={set('path')} /></div>
        <div className="field"><label className="label" htmlFor="api-auth">Auth</label>
          <select id="api-auth" className="f" value={cfg.auth} onChange={set('auth')}><option value="bearer">Bearer token</option><option value="apikey">API-key header</option></select></div>
        {cfg.auth === 'apikey' && <div className="field"><label className="label" htmlFor="api-hname">Header name</label>
          <input id="api-hname" className="f mono" value={cfg.headerName} onChange={set('headerName')} /></div>}
        <div className="field" style={{ gridColumn: '1 / -1' }}><label className="label" htmlFor="api-token">Token</label>
          <input id="api-token" className="f mono" type="password" autoComplete="off" value={cfg.token} onChange={set('token')} placeholder="kept in memory only" /></div>
        <div className="field"><label className="label" htmlFor="api-from">From</label><input id="api-from" className="f" type="date" value={cfg.from} onChange={set('from')} /></div>
        <div className="field"><label className="label" htmlFor="api-to">To</label><input id="api-to" className="f" type="date" value={cfg.to} onChange={set('to')} /></div>
      </div>
      <div className="row">
        <button className="btn primary" onClick={run} disabled={state.status === 'loading'}>
          {state.status === 'loading' ? <Icon name="Loader2" className="spin" /> : <Icon name="RefreshCw" />} Fetch trades
        </button>
        <span className="tiny muted mono" style={{ overflowWrap: 'anywhere' }}>{cfg.baseUrl ? buildUrl() : 'GET {base}{path}'}</span>
      </div>
      {state.status === 'ok' && <div className="note ok">{state.msg}</div>}
      {state.status === 'error' && <div className="note err">{state.msg}</div>}
      <div className="tiny muted">The token lives only in this page's memory and is never saved. The JSON response goes through the same normalizer as CSV files.</div>
    </div>
  );
}

              <div className="row"><input id="fs-name" className="f grow" placeholder="or read a project file by name, e.g. tradebook.csv" value={name} onChange={(e) => setName(e.target.value)} />
                <button className="btn" onClick={() => name && onReadNamed(name)}>Read</button></div>
            )}
            <button className="btn ghost" onClick={onSample}><Icon name="Sparkles" /> Load sample data (example trades)</button>
          </div>
          <div className="card tight"><div className="card-h"><h3>Connect API</h3></div><ApiConnectPanel cfg={apiCfg} setCfg={setApiCfg} onFetched={onFetched} /></div>
        </div>
      </div>
      <Card title="Expected columns"><ExpectedColumns /><p className="tiny muted" style={{ marginBottom: 0 }}>Headers are matched case-insensitively with common broker synonyms (tradingsymbol, trade_type, qty, ltp…). You can fix any mapping after loading.</p></Card>
    </div>
  );
}

/* ------------------------------------------------------- settings */
function SettingsCapital({ settings, setSettings, derived }) {
  const set = (k) => (e) => setSettings({ ...settings, [k]: e.target.value });
  const flows = settings.flows;
  const upd = (id, k, v) => setSettings({ ...settings, flows: flows.map((f) => (f.id === id ? { ...f, [k]: v } : f)) });
  const del = (id) => setSettings({ ...settings, flows: flows.filter((f) => f.id !== id) });
  const add = (row) => setSettings({ ...settings, flows: [...flows, { id: uid(), date: todayStr(), amount: '', type: 'Pay-in', ...row }] });
  return (
    <div className="stack">
      <div className="stack" style={{ gap: 10 }}>
        <h3>Capital</h3>
        <div className="formgrid">
          <div className="field"><label className="label" htmlFor="st-cap">Starting capital (₹)</label><input id="st-cap" className="f mono" inputMode="decimal" value={settings.startCapital} onChange={set('startCapital')} placeholder="e.g. 1000000" /></div>
          <div className="field"><label className="label" htmlFor="st-date">Start date</label><input id="st-date" className="f" type="date" value={settings.startDate} onChange={set('startDate')} /></div>
          <div className="field"><label className="label" htmlFor="st-pv">Current portfolio value override (₹)</label><input id="st-pv" className="f mono" inputMode="decimal" value={settings.portfolioOverride} onChange={set('portfolioOverride')} placeholder="optional" /></div>
        </div>
        <div className="tiny muted">CAGR uses starting capital and start date. Without an override, ending value = starting capital + total P&amp;L.</div>
      </div>
      <div className="stack" style={{ gap: 10 }}>
        <div className="row"><h3 className="grow">Capital flows (for XIRR)</h3>
          {settings.startCapital && settings.startDate && <button className="btn sm" onClick={() => add({ date: settings.startDate, amount: settings.startCapital, type: 'Pay-in' })}>Add starting capital as pay-in</button>}
          <button className="btn sm" onClick={() => add({})}><Icon name="Plus" size={14} /> Add row</button></div>
        {flows.length === 0 ? <div className="note info">No flows yet. Add each deposit as a Pay-in and each withdrawal as a Payout. XIRR shows “—” until there is at least one.</div> : (
          <div className="tablewrap"><table className="t">
            <thead><tr><th>Date</th><th className="n">Amount (₹)</th><th>Type</th><th></th></tr></thead>
            <tbody>{flows.map((f) => (
              <tr key={f.id}>
                <td><input className="f" type="date" id={`flow-d-${f.id}`} aria-label="Flow date" value={f.date} onChange={(e) => upd(f.id, 'date', e.target.value)} /></td>
                <td><input className="f mono" style={{ textAlign: 'right' }} id={`flow-a-${f.id}`} aria-label="Flow amount" inputMode="decimal" value={f.amount} onChange={(e) => upd(f.id, 'amount', e.target.value)} /></td>
                <td><select className="f" id={`flow-t-${f.id}`} aria-label="Flow type" value={f.type} onChange={(e) => upd(f.id, 'type', e.target.value)}><option>Pay-in</option><option>Payout</option></select></td>
                <td><button className="iconbtn" aria-label="Delete flow" onClick={() => del(f.id)}><Icon name="Trash2" size={14} /></button></td>
              </tr>))}</tbody>
          </table></div>
        )}
        <div className="tiny muted">Pay-in is money deployed (negative cash flow). Payout is money taken out (positive). The current portfolio value ({fmtINR(derived.portfolioValue)}) is added as a final positive flow dated today.</div>
      </div>
      <div className="stack" style={{ gap: 10 }}>
        <h3>Assumptions</h3>
        <div className="formgrid">
          <div className="field"><label className="label" htmlFor="st-chg">Estimated charges, % of turnover</label><input id="st-chg" className="f mono" inputMode="decimal" value={settings.chargeRate} onChange={set('chargeRate')} /></div>
          <div className="field"><label className="label" htmlFor="st-risk">Default 1R, % of entry value</label><input id="st-risk" className="f mono" inputMode="decimal" value={settings.riskPct} onChange={set('riskPct')} /></div>
        </div>
        <div className="tiny muted">The charges rate applies only to fills that have no charges column. 1R is used by the simulator when a trade has no stop-loss.</div>
      </div>
    </div>
  );
}

  { key: 'strike', label: 'Strike', n: true, get: (p) => p.strike, render: (p) => (p.strike ? `${fmtNum(p.strike)} ${p.option_type}` : '—'), on: false },
  { key: 'sector', label: 'Sector', get: (p) => p.sector, render: (p) => p.sector || '—', on: false },
  { key: 'charges', label: 'Charges', n: true, get: (p) => p.charges, render: (p) => fmtINR(p.charges) + (p.chargesEstimated ? '*' : ''), on: false },

];

function PositionBreakdown({ p, fillRealized, fillCharges }) {
  const orders = useMemo(() => {
    const m = new Map();
    p.fills.forEach((f) => { const k = f.order_id || f.key; if (!m.has(k)) m.set(k, []); m.get(k).push(f); });
    return [...m.entries()].map(([id, fs]) => {
      const q = sum(fs, (f) => f.qty);
      return { id, fills: fs, side: fs[0].side, date: fs[0].date, time: fs[0].time, qty: q, avg: sum(fs, (f) => f.qty * f.price) / q,
        realized: sum(fs, (f) => fillRealized[f.key] || 0), charges: sum(fs, (f) => fillCharges[f.key] || 0), hasOrderId: !!fs[0].order_id };
    });
  }, [p, fillRealized, fillCharges]);
  return (
    <div style={{ padding: '6px 0' }}>
      <table className="t" style={{ background: 'var(--bg)' }}>
        <thead><tr><th>Order</th><th>Trade</th><th>Date</th><th>Side</th><th className="n">Qty</th><th className="n">Price</th><th className="n">Charges</th><th className="n">Realized booked</th></tr></thead>
        <tbody>
          {orders.map((o) => (
            <Fragment key={o.id}>
              <tr><td className="mono">{o.hasOrderId ? o.id : '(no order id)'}</td><td className="muted">{o.fills.length} fill{o.fills.length > 1 ? 's' : ''}</td><td>{fmtDate(o.date)} <span className="muted tiny">{o.time}</span></td>
                <td><Pill kind={o.side === 'BUY' ? 'buy' : 'sell'}>{o.side}</Pill></td><td className="n">{fmtNum(o.qty, 0)}</td><td className="n">{fmtNum(o.avg)}</td><td className="n">{fmtINR(o.charges, 2)}</td>
                <td className={'n ' + toneOf(o.realized)}>{o.realized ? fmtSigned(o.realized) : ''}</td></tr>
              {o.fills.length > 1 && o.fills.map((f) => (
                <tr className="sub" key={f.key}><td></td><td className="mono muted">{f.trade_id || '—'}</td><td className="muted">{f.time}</td><td></td><td className="n">{fmtNum(f.qty, 0)}</td><td className="n">{fmtNum(f.price)}</td><td className="n">{fmtINR(fillCharges[f.key], 2)}</td>
                  <td className={'n ' + toneOf(fillRealized[f.key])}>{fillRealized[f.key] ? fmtSigned(fillRealized[f.key]) : ''}</td></tr>
              ))}
            </Fragment>
          ))}
        </tbody>
        <tfoot><tr><td colSpan={2}>Aggregate</td><td>{fmtDate(p.openDate)}</td><td></td><td className="n">{p.openQty ? `${fmtNum(p.openQty, 0)} open` : 'flat'}</td><td className="n">{p.avgOpen ? fmtNum(p.avgOpen) : ''}</td><td className="n">{fmtINR(p.charges, 2)}</td><td className={'n ' + toneOf(p.realized)}>{fmtSigned(p.realized)}</td></tr></tfoot>
      </table>
      {Math.abs(p.integrityDiff) > 0.01 && <div className="note err" style={{ marginTop: 8 }}>Integrity check failed by {fmtINR(p.integrityDiff, 2)}.</div>}
      {isNum(p.reportedPnl) && Math.abs(p.reportedPnl - p.realized) > 1 && <div className="note" style={{ marginTop: 8 }}>File-reported P&amp;L {fmtSigned(p.reportedPnl, 2)} differs from FIFO realized {fmtSigned(p.realized, 2)}.</div>}
    </div>
  );
}

function OverviewTable({ positions, fillRealized, fillCharges }) {
  const [vis, setVis] = useState(() => Object.fromEntries(OVERVIEW_COLS.map((c) => [c.key, c.on])));
  const [showPicker, setShowPicker] = useState(false);
  const [open, setOpen] = useState({});
  const [filter, setFilter] = useState('all');
  const getters = useMemo(() => Object.fromEntries(OVERVIEW_COLS.map((c) => [c.key, c.get])), []);
  const rows = useMemo(() => positions.filter((p) => filter === 'all' || (filter === 'open' ? p.status !== 'CLOSED' : p.status === 'CLOSED')), [positions, filter]);
  const { sorted, Th } = useSort(rows, null, getters);
  const cols = OVERVIEW_COLS.filter((c) => vis[c.key]);
  return (
    <Card title={`Positions (${rows.length})`} right={<>
      <Seg value={filter} options={[['all', 'All'], ['open', 'Open'], ['closed', 'Closed']]} onChange={setFilter} />
      <button className="btn sm" onClick={() => setShowPicker((s) => !s)}><Icon name="Columns3" size={14} /> Columns</button></>}>
      {showPicker && <div className="colpicker" style={{ marginBottom: 12 }}>
        {OVERVIEW_COLS.map((c) => <label key={c.key}><input type="checkbox" id={`col-${c.key}`} checked={!!vis[c.key]} onChange={(e) => setVis({ ...vis, [c.key]: e.target.checked })} />{c.label}</label>)}
      </div>}
      <div className="tablewrap" style={{ maxHeight: 620 }}>
        <table className="t">
          <thead><tr><th style={{ width: 24 }}></th>{cols.map((c) => <Th key={c.key} k={c.key} n={c.n}>{c.label}</Th>)}</tr></thead>
          <tbody>
            {sorted.map((p) => (
              <Fragment key={p.key}>
                <tr className="click" onClick={() => setOpen({ ...open, [p.key]: !open[p.key] })} aria-expanded={!!open[p.key]}>
                  <td className="muted"><Icon name={open[p.key] ? 'ChevronDown' : 'ChevronRight'} size={14} /></td>
                  {cols.map((c) => <td key={c.key} className={c.n ? 'n' : ''}>{c.render(p)}</td>)}
                </tr>
                {open[p.key] && <tr><td colSpan={cols.length + 1} style={{ padding: '0 10px 10px', whiteSpace: 'normal' }}><PositionBreakdown p={p} fillRealized={fillRealized} fillCharges={fillCharges} /></td></tr>}
              </Fragment>
            ))}
          </tbody>
        </table>
      </div>
      <div className="tiny muted" style={{ marginTop: 8 }}>Click a row for its order → trade → aggregate breakdown. * = at cost or estimated.</div>
    </Card>
  );
}

function Overview({ ledger, totals, returns, onSettings }) {
  const integrityOk = ledger.positions.every((p) => Math.abs(p.integrityDiff) < 0.01);
  return (
    <div className="stack">
      <div className="kpis">
        <KpiCard label="Total P&L" value={fmtSigned(totals.total)} tone={toneOf(totals.total)} hint={totals.missingCmp ? `${totals.missingCmp} open at cost` : 'realized + unrealized'} />
        <KpiCard label="Realized" value={fmtSigned(totals.realized)} tone={toneOf(totals.realized)} hint="FIFO, booked on close date" />
        <KpiCard label="Unrealized" value={fmtSigned(totals.unrealized)} tone={toneOf(totals.unrealized)} hint={totals.openCount ? 'open lots at CMP' : 'no open lots'} />
        <KpiCard label="Net after charges" value={fmtSigned(totals.net)} tone={toneOf(totals.net)} hint={`charges ${fmtINR(totals.charges)}`} />
        <KpiCard label="Open positions" value={totals.openCount} hint={`${fmtINR(totals.invested)} at cost`} />
        <KpiCard label="Win rate" value={isNum(totals.winRate) ? totals.winRate.toFixed(1) + '%' : '—'} hint={`${totals.wins}W / ${totals.losses}L closed`} />
        <KpiCard label="CAGR" value={isNum(returns.cagr.value) ? fmtPct(returns.cagr.value * 100) : '—'} tone={toneOf(returns.cagr.value)}
          hint={isNum(returns.cagr.value) ? `${returns.cagr.years.toFixed(2)} yrs${returns.cagr.short ? ' · short period' : ''}` : <a href="#settings" onClick={(e) => { e.preventDefault(); onSettings(); }} className="acc">{returns.cagr.hint}</a>} />
        <KpiCard label="XIRR" value={isNum(returns.xirr.value) ? fmtPct(returns.xirr.value * 100) : '—'} tone={toneOf(returns.xirr.value)}
          hint={isNum(returns.xirr.value) ? `${returns.flowCount} flows + current value` : <a href="#settings" onClick={(e) => { e.preventDefault(); onSettings(); }} className="acc">{returns.xirr.hint}</a>} />
      </div>
      <div className={'note ' + (integrityOk ? 'ok' : 'err')}>
        {integrityOk ? <>Integrity check passed: for every symbol, realized P&amp;L = Σ sells − Σ buys (adjusted for lots still open).</> : <>Integrity mismatch on {ledger.positions.filter((p) => Math.abs(p.integrityDiff) >= 0.01).map((p) => p.label).join(', ')}.</>}
      </div>
      <OverviewTable positions={ledger.positions} fillRealized={ledger.fillRealized} fillCharges={ledger.fillCharges} />
    </div>
  );
}

/* ------------------------------------------------------- holdings */
function speedBadge(h) {
  const ret = h.openReturnPct, d = Math.max(1, h.daysHeld || 0);
  if (isNum(ret) && ret > 0 && ret / d >= 0.5) return 'Fast';
  if ((h.daysHeld || 0) <= 10) return 'Early';
  if (isNum(ret) && ret > 0 && !(d > 30 && ret / d < 0.05)) return 'Steady';
  return 'Stuck';
}
const SpeedPill = ({ b }) => <Pill kind={b.toLowerCase()}>{b}</Pill>;

function HoldingsTable({ holdings, totalValue, cmpOverrides, setCmp }) {
  const getters = useMemo(() => ({ alloc: (h) => h.marketValue, badge: (h) => speedBadge(h) }), []);
  const { sorted, Th } = useSort(holdings, { key: 'marketValue', dir: 'desc' }, getters);
  const CmpInput = ({ h }) => (
    <input className="f mono" style={{ width: 92, textAlign: 'right', padding: '3px 6px' }} id={`cmp-${h.key}`} aria-label={`CMP for ${h.label}`}
      defaultValue={cmpOverrides[h.key] ?? (h.cmp ?? '')} placeholder="CMP"
      onBlur={(e) => setCmp(h.key, e.target.value)} onKeyDown={(e) => e.key === 'Enter' && e.currentTarget.blur()} />
  );
  return (
    <>
      <div className="tablewrap htable">
        <table className="t">
          <thead><tr>
            <Th k="strategy">Strategy</Th><Th k="label">Symbol</Th><Th k="sector">Sector</Th><Th k="kind">Type</Th><Th k="expiry">Expiry</Th><Th k="option_type">CE/PE</Th><Th k="strike" n>Strike</Th>
            <Th k="openQty" n>Qty</Th><Th k="avgOpen" n>Buy Price</Th><th className="n">CMP</th><Th k="marketValue" n>Value</Th><Th k="alloc" n>Alloc %</Th><Th k="todayMtm" n>Today MTM</Th>
            <Th k="realized" n>Realized</Th><Th k="total" n>Total P&amp;L</Th><Th k="openReturnPct" n>Return %</Th><Th k="daysHeld" n>Days</Th><Th k="badge">Speed</Th>
          </tr></thead>
          <tbody>
            {sorted.map((h) => (
              <tr key={h.key}>
                <td>{h.strategy || '—'}</td><td><b>{h.symbol}</b>{h.openDir < 0 ? <span className="tiny neg"> short</span> : null}</td><td>{h.sector || '—'}</td><td>{h.kind}</td>
                <td>{h.expiry ? fmtDate(h.expiry) : '—'}</td><td>{h.option_type || '—'}</td><td className="n">{h.strike ? fmtNum(h.strike) : '—'}</td>
                <td className="n">{fmtNum(h.openQty, 0)}</td><td className="n">{fmtNum(h.avgOpen)}</td><td className="n"><CmpInput h={h} /></td>
                <td className="n">{fmtINR(h.marketValue)}{h.hasCmp ? '' : '*'}</td><td className="n">{totalValue ? ((h.marketValue / totalValue) * 100).toFixed(1) + '%' : '—'}</td>
                <td className={'n ' + toneOf(h.todayMtm)}>{fmtSigned(h.todayMtm)}</td><td className={'n ' + toneOf(h.realized)}>{fmtSigned(h.realized)}</td>
                <td className={'n ' + toneOf(h.total)}>{fmtSigned(h.total)}</td><td className={'n ' + toneOf(h.openReturnPct)}>{fmtPct(h.openReturnPct)}</td>
                <td className="n">{h.daysHeld}</td><td><SpeedPill b={speedBadge(h)} /></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="hcards">
        {sorted.map((h) => (
          <div className="hcard" key={h.key}>
            <div className="row"><b className="grow">{h.label}</b><SpeedPill b={speedBadge(h)} /></div>
            <div className="tiny muted">{[h.strategy, h.sector, h.kind].filter(Boolean).join(' · ')}</div>
            <div className="kv">
              <div><div className="k">Qty</div><div className="v">{fmtNum(h.openQty, 0)}</div></div>
              <div><div className="k">Buy</div><div className="v">{fmtNum(h.avgOpen)}</div></div>
              <div><div className="k">CMP</div><div className="v"><CmpInput h={h} /></div></div>
              <div><div className="k">Value</div><div className="v">{compactINR(h.marketValue)}</div></div>
              <div><div className="k">Total P&amp;L</div><div className={'v ' + toneOf(h.total)}>{fmtSigned(h.total)}</div></div>
              <div><div className="k">Return</div><div className={'v ' + toneOf(h.openReturnPct)}>{fmtPct(h.openReturnPct)}</div></div>
              <div><div className="k">Alloc</div><div className="v">{totalValue ? ((h.marketValue / totalValue) * 100).toFixed(1) + '%' : '—'}</div></div>
              <div><div className="k">Today</div><div className={'v ' + toneOf(h.todayMtm)}>{fmtSigned(h.todayMtm)}</div></div>
              <div><div className="k">Days</div><div className="v">{h.daysHeld}</div></div>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

function Holdings({ ledger, cmpOverrides, setCmp }) {
  const holdings = ledger.positions.filter((p) => p.openQty > 1e-9);
  if (!holdings.length) return <div className="empty"><Icon name="Briefcase" size={26} /><div>No open positions. Every loaded position is flat.</div></div>;
  const invested = sum(holdings, (h) => h.openCost), value = sum(holdings, (h) => h.marketValue);
  const unreal = sum(holdings, (h) => h.unrealized), realizedPartial = sum(holdings, (h) => h.realized);
  const todays = holdings.filter((h) => isNum(h.todayMtm));
  const largest = [...holdings].sort((a, b) => b.marketValue - a.marketValue)[0];
  const noCmp = holdings.filter((h) => !h.hasCmp).length;
  return (
    <div className="stack">
      <div className="kpis">
        <KpiCard label="Invested" value={fmtINR(invested)} />
        <KpiCard label="Current value" value={fmtINR(value)} hint={noCmp ? `${noCmp} at cost (no CMP)` : 'at CMP'} />
        <KpiCard label="Unrealized P&L" value={fmtSigned(unreal)} tone={toneOf(unreal)} hint={invested ? fmtPct((unreal / invested) * 100) : ''} />
        <KpiCard label="Realized (partial)" value={fmtSigned(realizedPartial)} tone={toneOf(realizedPartial)} hint="booked on these symbols" />
        <KpiCard label="Today MTM" value={todays.length ? fmtSigned(sum(todays, (h) => h.todayMtm)) : '—'} tone={toneOf(sum(todays, (h) => h.todayMtm))} hint={todays.length ? `${todays.length} with prev close` : 'needs prev close'} />
        <KpiCard label="Holdings" value={holdings.length} />
        <KpiCard label="Largest alloc" value={value ? ((largest.marketValue / value) * 100).toFixed(1) + '%' : '—'} hint={largest.label} />
      </div>

}

const EMPTY_FORM = { symbol: '', side: 'BUY', qty: '', price: '', date: '', strategy: '', sector: '', stop_loss: '', target: '', remarks: '' };
function ManualEntryForm({ onAdd }) {
  const [f, setF] = useState(() => ({ ...EMPTY_FORM, date: todayStr() }));

function Journal({ fills, ledger, remarks, setRemark, onAddManual, onFiles }) {
  const [flt, setFlt] = useState({ symbol: '', strategy: '', side: '', from: '', to: '', result: '' });
  const [day, setDay] = useState(null);
  const T = useTok();
  const daily = useMemo(() => {
    const m = {};
    ledger.closedTrades.forEach((t) => { m[t.exitDate] = (m[t.exitDate] || 0) + t.pnl; });
    return Object.entries(m).sort().map(([date, pnl]) => ({ date, pnl }));
  }, [ledger]);
  const symbols = useMemo(() => [...new Set(fills.map((f) => f.symbol))].sort(), [fills]);
  const strategies = useMemo(() => [...new Set(fills.map((f) => f.strategy).filter(Boolean))].sort(), [fills]);
  const rows = useMemo(() => fills.filter((f) => {
    const r = ledger.fillRealized[f.key];
    if (day && f.date !== day) return false;
    if (flt.symbol && f.symbol !== flt.symbol) return false;
    if (flt.strategy && f.strategy !== flt.strategy) return false;
    if (flt.side && f.side !== flt.side) return false;
    if (flt.from && f.date < flt.from) return false;
    if (flt.to && f.date > flt.to) return false;
    if (flt.result === 'win' && !(r > 0)) return false;
    if (flt.result === 'loss' && !(r < 0)) return false;
    return true;
  }), [fills, flt, day, ledger]);
  const getters = useMemo(() => ({ realized: (f) => ledger.fillRealized[f.key], dt: (f) => f.date + f.time }), [ledger]);
  const { sorted, Th } = useSort(rows, { key: 'dt', dir: 'desc' }, getters);
  const set = (k) => (e) => setFlt({ ...flt, [k]: e.target.value });
  const [limit, setLimit] = useState(150);
  return (
    <div className="stack">
      <div className="grid2">
        <Card title="Add a trade"><ManualEntryForm onAdd={onAddManual} /></Card>
        <Card title="Import CSV"><DropZone onFiles={onFiles} compact /><p className="tiny muted" style={{ marginBottom: 0 }}>Imported rows are merged with what is already loaded; duplicates are skipped.</p></Card>
      </div>
      <Card title="Daily realized P&L" right={day ? <button className="btn sm" onClick={() => setDay(null)}>Showing {fmtDate(day)} · clear</button> : <span className="tiny muted">Click a bar to see that day's trades</span>}>
        <div className="chartbox sm">
          <ResponsiveContainer>
            <BarChart data={daily} margin={{ top: 6, right: 6, left: 0, bottom: 0 }} onClick={(e) => e?.activeLabel && setDay(e.activeLabel === day ? null : e.activeLabel)}>
              <CartesianGrid stroke={T.border} strokeDasharray="2 4" vertical={false} />
              <XAxis dataKey="date" {...axisProps(T)} tickFormatter={fmtDateShort} minTickGap={24} />
              <YAxis {...axisProps(T)} tickFormatter={compactINR} width={62} />
              <Tooltip {...tipStyle(T)} formatter={(v) => [fmtSigned(v), 'Realized']} labelFormatter={fmtDate} cursor={{ fill: T.card2 }} />
              <ReferenceLine y={0} stroke={T.border} />
              <Bar dataKey="pnl" radius={[2, 2, 0, 0]} style={{ cursor: 'pointer' }}>
                {daily.map((d) => <Cell key={d.date} fill={d.pnl >= 0 ? T.pos : T.neg} fillOpacity={!day || day === d.date ? 1 : 0.3} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </Card>
      <Card title={`Trade history (${rows.length})`}>
        <div className="formgrid" style={{ marginBottom: 12 }}>
          <div className="field"><label className="label" htmlFor="jf-sym">Symbol</label><select id="jf-sym" className="f" value={flt.symbol} onChange={set('symbol')}><option value="">All</option>{symbols.map((s) => <option key={s}>{s}</option>)}</select></div>
          <div className="field"><label className="label" htmlFor="jf-str">Strategy</label><select id="jf-str" className="f" value={flt.strategy} onChange={set('strategy')}><option value="">All</option>{strategies.map((s) => <option key={s}>{s}</option>)}</select></div>
          <div className="field"><label className="label" htmlFor="jf-side">Side</label><select id="jf-side" className="f" value={flt.side} onChange={set('side')}><option value="">All</option><option>BUY</option><option>SELL</option></select></div>
          <div className="field"><label className="label" htmlFor="jf-from">From</label><input id="jf-from" className="f" type="date" value={flt.from} onChange={set('from')} /></div>
          <div className="field"><label className="label" htmlFor="jf-to">To</label><input id="jf-to" className="f" type="date" value={flt.to} onChange={set('to')} /></div>
          <div className="field"><label className="label" htmlFor="jf-res">Result</label><select id="jf-res" className="f" value={flt.result} onChange={set('result')}><option value="">All</option><option value="win">Wins (closing fills)</option><option value="loss">Losses (closing fills)</option></select></div>
        </div>
        <div className="tablewrap" style={{ maxHeight: 560 }}>
          <table className="t">
            <thead><tr><Th k="dt">Date</Th><Th k="symbol">Symbol</Th><Th k="side">Side</Th><Th k="qty" n>Qty</Th><Th k="price" n>Price</Th><Th k="strategy">Strategy</Th><Th k="realized" n>Realized</Th><th>Remarks</th></tr></thead>
            <tbody>
              {sorted.slice(0, limit).map((f) => {
                const r = ledger.fillRealized[f.key];
                return (
                  <tr key={f.key}>
                    <td>{fmtDate(f.date)} <span className="tiny muted">{f.time.slice(0, 5)}</span></td>
                    <td><b>{positionLabel(f)}</b></td>
                    <td><Pill kind={f.side === 'BUY' ? 'buy' : 'sell'}>{f.side}</Pill></td>
                    <td className="n">{fmtNum(f.qty, 0)}</td><td className="n">{fmtNum(f.price)}</td>
                    <td>{f.strategy || <span className="muted">—</span>}</td>
                    <td className={'n ' + toneOf(r)}>{isNum(r) ? fmtSigned(r) : ''}</td>
                    <td style={{ minWidth: 220 }}><input className="f" style={{ padding: '3px 6px' }} id={`rm-${f.key}`} aria-label="Remarks" value={remarks[f.key] ?? f.remarks ?? ''} onChange={(e) => setRemark(f.key, e.target.value)} placeholder="Add a note" /></td>

        {sorted.length > limit && <button className="btn sm" style={{ marginTop: 10 }} onClick={() => setLimit(limit + 300)}>Show more ({sorted.length - limit} hidden)</button>}

    </div>
  );
}

function TradeJourneyChart({ position }) {
  const T = useTok();
  if (!position) return null;

  const buys = data.filter((d) => d.side === 'BUY'), sells = data.filter((d) => d.side === 'SELL');
  const Dot = (color, up) => (props) => {
    const { cx, cy } = props; if (!isNum(cx) || !isNum(cy)) return null;
    return <path d={up ? `M${cx},${cy - 7} L${cx + 6},${cy + 4} L${cx - 6},${cy + 4} Z` : `M${cx},${cy + 7} L${cx + 6},${cy - 4} L${cx - 6},${cy - 4} Z`} fill={color} stroke={T.card} strokeWidth={1} />;
  };
  return (
    <div className="chartbox">
      <ResponsiveContainer>
        <ComposedChart data={data} margin={{ top: 12, right: 96, left: 0, bottom: 0 }}>
          <CartesianGrid stroke={T.border} strokeDasharray="2 4" />
          <XAxis dataKey="t" type="number" scale="time" domain={['dataMin - 86400000', 'dataMax + 86400000']} {...axisProps(T)} tickFormatter={(t) => fmtDateShort(fromDayNum(Math.floor(t / 864e5)))} minTickGap={30} />
          <YAxis dataKey="price" domain={['auto', 'auto']} {...axisProps(T)} width={62} tickFormatter={(v) => fmtNum(v, 0)} />
          <Tooltip {...tipStyle(T)} labelFormatter={(t) => fmtDate(fromDayNum(Math.floor(t / 864e5)))} formatter={(v, n, p) => [`${fmtNum(v)} × ${fmtNum(p.payload.qty, 0)}`, p.payload.side]} />
          <Line dataKey="price" stroke={T.muted} strokeWidth={1} strokeDasharray="3 3" dot={false} isAnimationActive={false} />

          {position.avgSell && <ReferenceLine y={position.avgSell} stroke={T.neg} strokeDasharray="5 4" label={{ value: `Avg sell ${fmtNum(position.avgSell)}`, position: position.avgSell <= (position.avgBuy || 0) ? 'insideBottomRight' : 'insideTopRight', fill: T.neg, fontSize: 10 }} />}
          {position.cmp && <ReferenceLine y={position.cmp} stroke={T.accent} label={{ value: `CMP ${fmtNum(position.cmp)}`, position: 'right', fill: T.accent, fontSize: 10 }} />}
        </ComposedChart>
      </ResponsiveContainer>
    </div>
  );
}

let lwPromise = null;
function loadLightweightCharts() {
  if (window.LightweightCharts) return Promise.resolve(window.LightweightCharts);
  if (lwPromise) return lwPromise;
  const urls = ['https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
    'https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js'];
  lwPromise = new Promise((resolve, reject) => {
    const tryAt = (i) => {
      if (i >= urls.length) { lwPromise = null; reject(new Error('blocked')); return; }
      const s = document.createElement('script');
      s.src = urls[i]; s.async = true;
      const timer = setTimeout(() => { s.onerror = s.onload = null; tryAt(i + 1); }, 8000);
      s.onload = () => { clearTimeout(timer); window.LightweightCharts ? resolve(window.LightweightCharts) : tryAt(i + 1); };
      s.onerror = () => { clearTimeout(timer); tryAt(i + 1); };
      document.head.appendChild(s);
    };
    tryAt(0);
  });
  return lwPromise;
}

function RechartsCandles({ candles, markers }) {
  const T = useTok();
  const data = candles.map((c) => ({ ...c, range: [c.low, c.high] }));
  const Candle = (props) => {
    const { x, y, width, height, payload } = props;
    if (!payload || !isNum(height)) return null;
    const { open, close, high, low } = payload;
    const ppu = (high - low) ? height / (high - low) : 0;
    const top = y + (high - Math.max(open, close)) * ppu, bot = y + (high - Math.min(open, close)) * ppu;
    const col = close >= open ? T.pos : T.neg, cx = x + width / 2, w = Math.max(1, width * 0.7);
    return <g><line x1={cx} x2={cx} y1={y} y2={y + height} stroke={col} /><rect x={cx - w / 2} y={top} width={w} height={Math.max(1, bot - top)} fill={col} /></g>;
  };
  const mk = Object.fromEntries(markers.map((m) => [m.time, m]));
  return (
    <div className="chartbox">
      <ResponsiveContainer>
        <ComposedChart data={data} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
          <CartesianGrid stroke={T.border} strokeDasharray="2 4" vertical={false} />
          <XAxis dataKey="time" {...axisProps(T)} tickFormatter={fmtDateShort} minTickGap={30} />
          <YAxis domain={['auto', 'auto']} {...axisProps(T)} width={62} tickFormatter={(v) => fmtNum(v, 0)} />
          <Tooltip {...tipStyle(T)} labelFormatter={(l) => fmtDate(l) + (mk[l] ? ` · ${mk[l].text}` : '')} formatter={(v, n, p) => n === 'range' ? [`O ${fmtNum(p.payload.open)} H ${fmtNum(p.payload.high)} L ${fmtNum(p.payload.low)} C ${fmtNum(p.payload.close)}`, ''] : [v, n]} />
          <Bar dataKey="range" shape={<Candle />} isAnimationActive={false} />
          {markers.map((m, i) => <ReferenceLine key={i} x={m.time} stroke={m.side === 'BUY' ? T.pos : T.neg} strokeDasharray="2 3" strokeOpacity={0.7} />)}
        </ComposedChart>
      </ResponsiveContainer>
    </div>
  );
}

function CandleChart({ symbol, candles, position }) {
  const T = useTok();
  const ref = useRef(null);
  const [lib, setLib] = useState(window.LightweightCharts ? 'ready' : 'loading');
  useEffect(() => { if (!candles?.length) return; loadLightweightCharts().then(() => setLib('ready'), () => setLib('blocked')); }, [candles]);
  const markers = useMemo(() => {
    if (!position) return [];
    const byDay = {};
    position.fills.forEach((f) => { const k = f.date + f.side; byDay[k] = byDay[k] || { time: f.date, side: f.side, qty: 0 }; byDay[k].qty += f.qty; });
    return Object.values(byDay).sort((a, b) => a.time.localeCompare(b.time)).map((m) => ({ ...m, text: `${m.side === 'BUY' ? 'B' : 'S'} ${fmtNum(m.qty, 0)}` }));
  }, [position]);
  useEffect(() => {
    if (lib !== 'ready' || !candles?.length || !ref.current) return;
    const LW = window.LightweightCharts;
    const chart = LW.createChart(ref.current, {
      autoSize: true, layout: { background: { color: T.card }, textColor: T.muted, fontFamily: 'IBM Plex Mono, monospace' },
      grid: { vertLines: { color: T.border }, horzLines: { color: T.border } }, rightPriceScale: { borderColor: T.border }, timeScale: { borderColor: T.border },
    });
    const series = chart.addCandlestickSeries({ upColor: T.pos, downColor: T.neg, borderVisible: false, wickUpColor: T.pos, wickDownColor: T.neg });
    series.setData(candles);
    const days = new Set(candles.map((c) => c.time));
    series.setMarkers(markers.filter((m) => days.has(m.time)).map((m) => ({ time: m.time, position: m.side === 'BUY' ? 'belowBar' : 'aboveBar', color: m.side === 'BUY' ? T.pos : T.neg, shape: m.side === 'BUY' ? 'arrowUp' : 'arrowDown', text: m.text })));
    if (position?.avgBuy) series.createPriceLine({ price: position.avgBuy, color: T.pos, lineStyle: 2, lineWidth: 1, title: 'avg buy' });
    if (position?.avgSell) series.createPriceLine({ price: position.avgSell, color: T.neg, lineStyle: 2, lineWidth: 1, title: 'avg sell' });
    chart.timeScale().fitContent();
    return () => chart.remove();
  }, [lib, candles, markers, T, position]);
  if (!candles?.length) return <div className="note info">No OHLC data for {symbol}. Candles need prices from your API or SEED_DATA (a <code>candles</code> key). The trade-journey chart above still shows your fills.</div>;
  if (lib === 'blocked') return <><div className="note">TradingView Lightweight Charts could not load (blocked by the sandbox CSP), so this is the built-in fallback.</div><RechartsCandles candles={candles} markers={markers} /></>;
  if (lib === 'loading') return <div className="muted small"><Icon name="Loader2" className="spin" size={14} /> Loading TradingView Lightweight Charts…</div>;
  return <div ref={ref} className="lwbox" />;
}

function EquityCurve({ ledger, startCapital }) {
  const T = useTok();
  const data = useMemo(() => {
    const m = {};
    ledger.closedTrades.forEach((t) => { m[t.exitDate] = (m[t.exitDate] || 0) + t.pnl; });
    let c = startCapital || 0, peak = -Infinity;
    return Object.entries(m).sort().map(([date, p]) => { c += p; peak = Math.max(peak, c); return { date, equity: c, dd: c - peak }; });
  }, [ledger, startCapital]);
  if (!data.length) return <div className="muted small">No closed trades yet.</div>;
  return (
    <div className="chartbox">
      <ResponsiveContainer>
        <ComposedChart data={data} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
          <defs><linearGradient id="eqfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={T.accent} stopOpacity={0.35} /><stop offset="100%" stopColor={T.accent} stopOpacity={0} /></linearGradient></defs>
          <CartesianGrid stroke={T.border} strokeDasharray="2 4" vertical={false} />
          <XAxis dataKey="date" {...axisProps(T)} tickFormatter={fmtDateShort} minTickGap={30} />
          <YAxis {...axisProps(T)} tickFormatter={compactINR} width={66} domain={['auto', 'auto']} />
          <Tooltip {...tipStyle(T)} labelFormatter={fmtDate} formatter={(v, n, p) => [`${fmtINR(v)}${p.payload.dd < 0 ? ` (drawdown ${fmtINR(p.payload.dd)})` : ''}`, startCapital ? 'Equity' : 'Cumulative realized']} />
          <Area dataKey="equity" stroke={T.accent} strokeWidth={2} fill="url(#eqfill)" isAnimationActive={false} />
        </ComposedChart>
      </ResponsiveContainer>
    </div>
  );
}

function SectorDonut({ positions }) {
  const T = useTok();
  const open = positions.filter((p) => p.openQty > 1e-9);
  const basis = open.length ? 'open value' : 'traded value';
  const data = useMemo(() => {
    const m = {};
    (open.length ? open : positions).forEach((p) => { const k = p.sector || 'Unassigned'; m[k] = (m[k] || 0) + (open.length ? p.marketValue : p.buyVal + p.sellVal); });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [positions]);
  const tot = sum(data, (d) => d.value);
  return (
    <div className="row" style={{ alignItems: 'stretch' }}>
      <div style={{ width: 200, height: 200, flex: '0 0 auto', maxWidth: '100%' }}>

        </ResponsiveContainer>
      </div>
      <div className="stack grow" style={{ gap: 6, justifyContent: 'center' }}>
        <div className="tiny muted">By {basis}</div>
        {data.map((d, i) => <div key={d.name} className="row small" style={{ gap: 8 }}><span style={{ width: 10, height: 10, borderRadius: 3, background: T.cat[i % 8] }} /><span className="grow">{d.name}</span><span className="mono">{((d.value / tot) * 100).toFixed(1)}%</span></div>)}
      </div>
    </div>
  );
}

function MonthlyPnl({ trades }) {
